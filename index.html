<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Canvas MVP · 节点 / 连线 / Alt+Enter 执行</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<div id="stage">
  <aside id="outline">
    <div class="ol-tabs">
      <span class="ol-tab active" data-tab="outline">📑 大纲</span>
      <span class="ol-tab" data-tab="tasks">⚡ 任务</span>
    </div>
    <div class="ol-pane" id="paneOutline">
      <div class="ol-head">
        <span class="spacer"></span>
        <button class="ghost" id="addZone" style="padding:4px 8px;font-size:12px">＋区域</button>
      </div>
      <div id="levelFilter"></div>
      <div class="ol-body" id="outlineBody"></div>
    </div>
    <div class="ol-pane" id="paneTasks" style="display:none">
      <div class="ol-head">
        <span class="spacer"></span>
        <button class="ghost" id="addTask" style="padding:4px 8px;font-size:12px">＋新建任务</button>
      </div>
      <div class="ol-body" id="taskBody"></div>
    </div>
  </aside>

  <div id="canvasWrap">
    <div id="toast"></div>
    <div id="canvas">
      <div id="world">
        <svg id="edges"></svg>
      </div>
    </div>
    <div id="minimap"><canvas></canvas></div>
    <div id="viewctl">
      <button id="zoomOut" title="缩小">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" title="放大">＋</button>
      <button id="fit" title="适应全部内容">适应</button>
      <button id="reset1" title="100% 居中">1:1</button>
      <button id="toggleMap" title="显示/隐藏小地图">地图</button>
    </div>
    <div id="toolbar">
      <input id="apiKey" class="key" type="password" placeholder="DeepSeek API Key" />
      <button class="ghost" id="addDoc">＋ 文档节点</button>
      <button class="ghost" id="addOutput">＋ 输出节点</button>
      <button class="ghost" id="addImg">＋ 图片节点</button>
      <button class="ghost" id="addExec">＋ 执行节点</button>
      <button class="ghost" id="importFiles">📂 导入文件</button>
      <button class="ghost" id="importUrl">🔗 从链接导入</button>
      <button class="ghost" id="saveCanvas">💾 保存</button>
      <button class="ghost" id="exportJson">⬇ 导出</button>
      <button class="ghost" id="importJson">⬆ 导入</button>
      <button id="runAll">全部运行 ▶</button>
      <input type="file" id="filePicker" multiple style="display:none"
             accept=".txt,.md,.markdown,.csv,.json,.log,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,image/*" />
      <input type="file" id="jsonPicker" accept=".json" style="display:none" />
      <span id="hint">
        连出线：拖节点右侧圆点 · 编辑命令：单击连线标签 · 执行：<kbd>Alt</kbd>+<kbd>Enter</kbd><br>
        导入：按钮选择 / 拖文件到画布 · 平移：空白处拖拽 · 缩放：<kbd>Ctrl</kbd>滚轮
      </span>
    </div>
    <button id="toggleOutline" title="展开/折叠大纲栏">📑 大纲</button>
    <button id="toggleSidebar" title="展开/折叠对话栏">≡ 对话</button>
  </div>

  <aside id="sidebar">
    <div class="sb-head">
      <span>💬 对话（看图）</span>
      <span class="chip" id="ctxChip">上下文：0 节点</span>
      <span class="spacer"></span>
      <button class="ghost" id="clearChat" title="清空对话">清空</button>
    </div>
    <div class="sb-body">
      <div id="snapshot">
        <div class="snap-title">📋 将随消息发送的画布快照 <span style="font-weight:400;color:#999">（自动更新）</span></div>
        <pre id="snapText">（空画布）</pre>
        <div class="thumbs" id="snapThumbs"></div>
      </div>
      <div id="msgs"></div>
      <div class="sb-input">
        <textarea id="chatInput" placeholder="问关于画布的问题，如「帮我概括当前图的结构」「N2 的内容讲了什么？」&#10;Enter 发送 · Shift+Enter 换行"></textarea>
        <div class="sb-actions">
          <label><input type="checkbox" id="includeImages" checked> 附带图片</label>
          <span class="grow"></span>
          <button id="sendMsg">发送 ▶</button>
        </div>
      </div>
    </div>
  </aside>
</div>


<script type="module" src="./js/main.js"></script>
</body>
</html>
