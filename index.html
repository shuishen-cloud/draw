<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MVP · 文档 → 命令连线 → 输出</title>
<style>
  :root {
    --bg: #f7f7f8;
    --node-bg: #ffffff;
    --border: #d5d7db;
    --accent: #4f46e5;
    --line: #9aa0a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  body { background: var(--bg); overflow: hidden; }

  #canvas { position: absolute; inset: 0; }

  /* SVG 连线层 */
  svg#edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg#edges path { fill: none; stroke: var(--line); stroke-width: 2.5; pointer-events: stroke; cursor: pointer; }
  svg#edges path:hover { stroke: var(--accent); }
  svg#edges path.executable { stroke: var(--accent); stroke-width: 3.5; }
  svg#edges text { font-size: 13px; fill: #444; cursor: pointer; pointer-events: all; user-select: none; }
  svg#edges text:hover { fill: var(--accent); }

  /* 节点 */
  .node {
    position: absolute;
    width: 300px;
    min-height: 140px;
    background: var(--node-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .node .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    background: #f0f1f3;
    cursor: grab;
    user-select: none;
  }
  .node .bar:active { cursor: grabbing; }
  .node .dot { width: 9px; height: 9px; border-radius: 50%; background: #c3c6cb; }
  .node[data-type="doc"] .dot { background: #16a34a; }
  .node[data-type="output"] .dot { background: #eab308; }

  .node textarea, .node .out {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    padding: 10px;
    font-size: 13.5px;
    line-height: 1.6;
    font-family: inherit;
    background: transparent;
    color: #222;
  }
  .node textarea { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .node .out { white-space: pre-wrap; overflow-y: auto; }
  .node .out.empty::before { content: "（执行结果会出现在这里）"; color: #b3b6bb; }

  /* 悬浮工具 */
  #toolbar {
    position: fixed;
    left: 16px; bottom: 16px;
    display: flex; gap: 8px; align-items: center;
    background: #fff; padding: 8px 10px; border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    font-size: 13px;
  }
  button {
    border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  button:disabled { background: #b9bbc3; cursor: not-allowed; }
  button.ghost { background: #eef0f3; color: #333; }
  #hint { color: #777; font-size: 12px; }
</style>
</head>
<body>

<div id="canvas">
  <svg id="edges"></svg>

  <div class="node" data-type="doc" id="node-a">
    <div class="bar"><span>📄 文档</span><span class="dot"></span></div>
    <textarea id="doc">人工智能正在改变世界。大语言模型可以写代码、做翻译、回答问题、总结长文。它们通过海量文本训练，学会了语言的统计规律。在实际应用中，人们常常需要把长文档压缩成要点，或者提炼出核心结论，以便快速阅读和决策。</textarea>
  </div>

  <div class="node" data-type="output" id="node-b">
    <div class="bar"><span>🎯 输出</span><span class="dot"></span></div>
    <div class="out empty" id="out"></div>
  </div>
</div>

<div id="toolbar">
  <input id="apiKey" type="password" placeholder="DeepSeek API Key" style="width:200px;padding:7px 9px;border:1px solid #d5d7db;border-radius:8px;font-size:13px" />
  <button id="run">运行 ▶</button>
  <button class="ghost" id="runAll">全部运行</button>
  <span id="hint">双击连线编辑命令（🖐️ 前缀才会执行）</span>
</div>

<script>
// ====== 1. 数据模型 ======
const state = {
  nodes: {
    a: { id: 'a', x: 80,  y: 120 },
    b: { id: 'b', x: 620, y: 120 },
  },
  edge: {
    id: 'e1',
    source: 'a',
    target: 'b',
    command: '🖐️总结',  // 只有以 🖐️ 开头才会执行
  },
};

const PREFIX = '🖐️';
const API_URL = 'https://api.deepseek.com/chat/completions';

// ====== [调试开关] ======
// 在浏览器控制台输入 DBG.on() 打开，DBG.off() 关闭。默认开启。
// 想看脱敏的完整请求体：运行一次后在控制台输入 DBG.lastRequest
const DBG = {
  enabled: true,
  lastRequest: null,
  on()  { this.enabled = true;  console.log('[DBG] 调试已开启'); },
  off() { this.enabled = false; console.log('[DBG] 调试已关闭'); },
  log(...args) { if (this.enabled) console.log('%c[DBG]', 'color:#4f46e5;font-weight:bold', ...args); },
  warn(...args) { if (this.enabled) console.warn('%c[DBG]', 'color:#d97706;font-weight:bold', ...args); },
  err(...args) { console.error('%c[DBG]', 'color:#dc2626;font-weight:bold', ...args); },
};
window.DBG = DBG; // 暴露到全局，方便控制台调用

// ====== 2. 渲染节点位置 ======
function renderNodes() {
  for (const id of Object.keys(state.nodes)) {
    const n = state.nodes[id];
    const el = document.getElementById('node-' + id);
    el.style.left = n.x + 'px';
    el.style.top  = n.y + 'px';
  }
}

// ====== 3. 渲染连线（含命令标签）======
function renderEdge() {
  const svg = document.getElementById('edges');
  const a = document.getElementById('node-a').getBoundingClientRect();
  const b = document.getElementById('node-b').getBoundingClientRect();
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();

  // 起点：A 右边缘中点；终点：B 左边缘中点
  const x1 = a.right - canvasRect.left, y1 = a.top - canvasRect.top + a.height / 2;
  const x2 = b.left  - canvasRect.left, y2 = b.top - canvasRect.top + b.height / 2;
  const mx = (x1 + x2) / 2;

  const executable = state.edge.command.trim().startsWith(PREFIX);

  // [调试点 1] 每次重绘连线时，确认当前边上的命令 & 是否被识别为可执行
  DBG.log('renderEdge | 命令=', JSON.stringify(state.edge.command),
          '| 可执行=', executable,
          '(判断依据: 去掉首尾空格后是否以 "' + PREFIX + '" 开头)');

  svg.innerHTML = `
    <path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}"
          class="${executable ? 'executable' : ''}" data-edge="e1" />
    <text x="${mx}" y="${(y1 + y2) / 2 - 10}" text-anchor="middle"
          data-edge="e1">${escapeHtml(state.edge.command || '(双击编辑命令)')}</text>
  `;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ====== 4. 拖拽节点 ======
function makeDraggable(nodeId) {
  const el = document.getElementById('node-' + nodeId);
  const bar = el.querySelector('.bar');
  let dx = 0, dy = 0, dragging = false;
  bar.addEventListener('mousedown', (e) => {
    dragging = true;
    const r = el.getBoundingClientRect();
    dx = e.clientX - r.left;
    dy = e.clientY - r.top;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    state.nodes[nodeId].x = e.clientX - dx;
    state.nodes[nodeId].y = e.clientY - dy;
    renderNodes();
    renderEdge();
  });
  window.addEventListener('mouseup', () => { dragging = false; });
}

// ====== 5. 编辑边上命令（双击）======
function bindEdgeEdit() {
  const svg = document.getElementById('edges');
  svg.addEventListener('dblclick', (e) => {
    const t = e.target.closest('[data-edge]');
    // [调试点 2] 双击是否命中连线元素；没命中就不会弹输入框
    if (!t) { DBG.warn('dblclick 未命中连线元素 (data-edge)，未弹输入框'); return; }
    DBG.log('dblclick 命中连线，准备编辑命令');
    const cur = state.edge.command;
    const next = prompt('输入命令（以 🖐️ 开头才会被执行）：', cur);
    if (next === null) { DBG.log('用户取消编辑，命令不变'); return; }
    state.edge.command = next;
    // [调试点 3] 记录编辑前后的命令，确认新命令真的写入了 state
    DBG.log('命令已更新: ', JSON.stringify(cur), '->', JSON.stringify(next));
    renderEdge();
  });
}

// ====== [辅助] 构造请求体 ======
// 专门抽成函数，保证「真实请求」和「调试打印的 DBG.lastRequest」是同一份数据，
// 避免两边写不一致导致调试结果误导。
function buildPayload(promptText, doc) {
  return {
    model: 'deepseek-chat',
    stream: true,
    temperature: 0.3,
    messages: [
      {
        role: 'system',
        content:
          '你是文本处理引擎。用户会给你一段【文档】，你必须严格按照【命令】处理它。\n' +
          '只输出处理结果本身，不要复述命令，不要添加解释、前言或后记。\n' +
          '【命令】可能不完整，请按其字面意图执行。\n\n' +
          '【命令】：' + (promptText || '处理下面的内容'),
      },
      {
        role: 'user',
        content: '【文档】开始\n' + doc + '\n【文档】结束\n\n请执行【命令】，只输出结果。',
      },
    ],
  };
}

// ====== 6. 执行核心 ======
async function runEdge() {
  DBG.log('========== runEdge 开始 ==========');
  const cmd = state.edge.command.trim();
  // [调试点 4] 执行入口：确认读到的原始命令
  DBG.log('读取命令 =', JSON.stringify(cmd));
  if (!cmd.startsWith(PREFIX)) {
    // [调试点 5] 最常见的"没反应"原因：命令没以 🖐️ 开头
    DBG.warn('命令未以 ' + PREFIX + ' 开头，中止执行。请双击连线修改命令。');
    alert('这条连线没有 🖐️ 前缀，不会执行。双击连线修改命令。');
    return;
  }
  const promptText = cmd.slice(PREFIX.length).trim(); // "总结"
  // [调试点 6] 真正作为 system prompt 的文本（PREFIX 之后的部分）
  DBG.log('解析出命令文本 promptText =', JSON.stringify(promptText));
  if (!promptText) DBG.warn('命令文本为空（只有 🖐️），将回退为默认提示');
  const doc = document.getElementById('doc').value;
  const outEl = document.getElementById('out');
  const runBtn = document.getElementById('run');
  // [调试点 7] 确认实际取到的文档内容
  DBG.log('文档内容长度 =', doc.length, '字符，前 50 字 =', JSON.stringify(doc.slice(0, 50)));

  const key = document.getElementById('apiKey').value.trim();
  // [调试点 8] 确认 key 是否存在（不打印 key 本身，只打印长度）
  DBG.log('API Key 长度 =', key.length);
  if (!key) { alert('请先填写 DeepSeek API Key'); return; }

  runBtn.disabled = true;
  outEl.classList.remove('empty');
  outEl.textContent = '思考中…';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key,
      },
      body: JSON.stringify(
        // [调试点 9] 请求体由 buildPayload 统一构造，下面打印的就是它
        (DBG.lastRequest = buildPayload(promptText, doc))
      ),
    });

    // [调试点 9] 打印真实发出的请求体（已脱敏 key）。控制台随时输 DBG.lastRequest 回看
    DBG.log('发起请求 ->', API_URL, '\n请求体 =', DBG.lastRequest);

    if (!res.ok) {
      // [调试点 10] HTTP 层面失败（401=key错, 402=余额不足, 429=限流）
      const errText = await res.text();
      DBG.err('HTTP 请求失败 status =', res.status, 'body =', errText);
      throw new Error('HTTP ' + res.status + ' ' + errText);
    }

    // 流式读取
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let chunkCount = 0;   // [调试]计数：收到多少个有内容的 SSE 数据块
    let outText = '';      // [调试]累计输出，结束时一次性打印
    outEl.textContent = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const payload = s.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) chunkCount++;      // [调试] 只统计有内容的增量
          outText += delta;
          outEl.textContent += delta;
        } catch (parseErr) {
          // [调试点 11] SSE 单行解析失败（如果输出为空，这里很可能有报错）
          DBG.warn('SSE 行解析失败:', JSON.stringify(s), parseErr.message);
        }
      }
    }
    // [调试点 12] 流结束：确认到底收到了多少内容
    DBG.log('流式结束 | 增量块数 =', chunkCount, '| 最终输出长度 =', outText.length);
    if (!outText) DBG.warn('输出为空！请检查 DBG.lastRequest 与 HTTP 状态码');
  } catch (err) {
    // [调试点 13] 任何异常（网络/跨域/解析）都会到这里
    DBG.err('runEdge 异常:', err);
    outEl.textContent = '❌ ' + err.message;
  } finally {
    runBtn.disabled = false;
    DBG.log('========== runEdge 结束 ==========');
  }
}

// ====== 7. 初始化 ======
renderNodes();
renderEdge();
['a', 'b'].forEach(makeDraggable);
bindEdgeEdit();
document.getElementById('run').addEventListener('click', runEdge);
document.getElementById('runAll').addEventListener('click', runEdge);
window.addEventListener('resize', renderEdge);
// 节点内容/尺寸变化时重画连线
new ResizeObserver(renderEdge).observe(document.getElementById('node-b'));
</script>
</body>
</html>
