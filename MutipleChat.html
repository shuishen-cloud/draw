const TEXT_EXT = ['txt','md','markdown','csv','json','log','js','ts','jsx','tsx','py',
  'html','css','xml','yaml','yml','ini','conf','sh','java','go','rs','c','cpp','sql'];

// 找到一块空位，避免新节点重叠
function findFreeSpot(w = 300, h = 180) {
  const nodes = Object.values(state.nodes);
  if (!nodes.length) return { x: 160, y: 160 };
  // 取最右节点的右侧
  let maxRight = -Infinity, topY = 0;
  for (const n of nodes) {
    if (n.x + n.w > maxRight) { maxRight = n.x + n.w; topY = n.y; }
  }
  return { x: maxRight + 60, y: topY };
}

// 依据文件类型创建节点
async function importFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const spot = findFreeSpot();

  if (file.type.startsWith('image/')) {
    const dataUrl = await readAsDataURL(file);
    const node = createNode('img', { x: spot.x, y: spot.y, title: file.name, src: dataUrl });
    return node;
  }

  if (TEXT_EXT.includes(ext) || file.type.startsWith('text/')) {
    const text = await readAsText(file);
    const node = createNode('doc', {
      x: spot.x, y: spot.y, title: file.name,
      text: text.slice(0, 100000),   // 限制单节点长度
    });
    DBG.log('导入文本文件', file.name, text.length, '字');
    return node;
  }

  // 其他类型：尝试当文本读
  try {
    const text = await readAsText(file);
    return createNode('doc', { x: spot.x, y: spot.y, title: file.name, text: text.slice(0, 100000) });
  } catch {
    alert(`不支持的文件类型：${file.name}`);
    return null;
  }
}

function readAsText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsText(file);
  });
}
function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

// 批量导入
async function importFiles(files) {
  const list = [...files];
  DBG.log('开始导入', list.length, '个文件');
  for (const f of list) {
    try { await importFile(f); }
    catch (e) { DBG.err('导入失败', f.name, e); }
  }
  redrawEdges();
  fitToContent();
  refreshOutline();
  window.scheduleSnapshot?.();
  DBG.log('导入完成');
}

// 从 URL 抓取
//  - 本地服务（http）打开时，走 /proxy（node server.js）
//  - 单文件离线版（file://）打开时，回退到公共 CORS 代理（需联网）
async function importFromUrl(url) {
  if (!url) url = prompt('输入要引入的网页地址：', 'https://');
  if (!url || !/^https?:\/\//.test(url)) return;
  DBG.log('抓取 URL', url);
  const spot = findFreeSpot();
  const node = createNode('doc', { x: spot.x, y: spot.y, title: '加载中…', text: '正在抓取 ' + url + ' …' });

  // 离线（file://）时没有本地代理，用公共代理兜底
  const offline = location.protocol === 'file:';
  const proxy = offline
    ? 'https://r.jina.ai/' + url                 // 公共阅读代理，返回网页正文文本
    : '/proxy?url=' + encodeURIComponent(url);

  try {
    const res = await fetch(proxy);
    if (offline) {
      // r.jina.ai 返回纯文本
      const text = await res.text();
      if (!res.ok) throw new Error('HTTP ' + res.status);
      node.title = (text.split('\n').find(l => l.trim()) || url).slice(0, 60);
      node.el.querySelector('.title').textContent = node.title;
      node.text = `【来源】${url}\n\n${text}`;
      node.textEl.value = node.text;
    } else {
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      node.title = (data.title || url).slice(0, 60);
      node.el.querySelector('.title').textContent = node.title;
      node.text = `【来源】${data.url}\n\n${data.text}`;
      node.textEl.value = node.text;
    }
    DBG.log('抓取成功', node.title, node.text.length, '字');
    redrawEdges(); refreshOutline(); window.scheduleSnapshot?.();
  } catch (e) {
    const hint = offline
      ? '❌ 抓取失败：' + e.message + '\n（离线单文件版需联网，且依赖公共代理 r.jina.ai；或改用「本地服务」方式打开）'
      : '❌ 抓取失败：' + e.message + '\n（请确认本地服务已启动：node server.js）';
    node.text = hint;
    node.textEl.value = node.text;
    DBG.err('抓取失败', e);
  }
}

// 拖文件到画布空白处 → 自动创建节点
function bindCanvasDrop() {
  const wrap = document.getElementById('canvasWrap');
  const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
  ['dragenter', 'dragover'].forEach(ev => wrap.addEventListener(ev, (e) => {
    if (e.dataTransfer?.types?.includes('Files')) { stop(e); wrap.classList.add('dropping'); }
  }));
  ['dragleave', 'drop'].forEach(ev => wrap.addEventListener(ev, (e) => {
    if (ev === 'dragleave' && e.relatedTarget && wrap.contains(e.relatedTarget)) return;
    wrap.classList.remove('dropping');
  }));
  wrap.addEventListener('drop', async (e) => {
    const files = [...(e.dataTransfer?.files || [])];
    if (!files.length) return;
    stop(e);
    // 图片拖到已存在的图片节点上时，交给节点自身处理（不新建）
    const onNode = e.target.closest && e.target.closest('.node');
    if (onNode && files.length === 1 && files[0].type.startsWith('image/')) return;
    await importFiles(files);
  });
}

// 把当前画布导出为纯数据对象（含图片 dataURL）
function exportCanvasData() {
  return {
    format: 'mutiplechat-canvas',
    version: 1,
    savedAt: new Date().toISOString(),
    view: { x: view.x, y: view.y, scale: view.scale },
    nodes: Object.values(state.nodes).map(n => ({
      id: n.id, kind: n.kind, title: n.title,
      x: n.x, y: n.y, w: n.w, h: n.h,
      text: n.text || '', src: n.src || '', prompt: n.prompt || '',
      zoneId: n.zoneId || null, level: n.level || 1,
    })),
    edges: Object.values(state.edges).map(e => ({
      id: e.id, source: e.source, target: e.target, command: e.command || '',
    })),
    zones: Object.values(state.zones).map(z => ({
      id: z.id, title: z.title, x: z.x, y: z.y, w: z.w, h: z.h,
      color: z.color, level: z.level || 1,
    })),
    tasks: Object.values(state.tasks).map(t => ({ name: t.name, edgeIds: [...t.edgeIds] })),
  };
}

// 从数据对象重建整个画布
function importCanvasData(data) {
  if (!data || data.format !== 'mutiplechat-canvas') {
    throw new Error('不是有效的画布文件');
  }
  window.__silentImport = true;   // 导入期间跳过逐项副作用，避免卡顿
  try {
    clearCanvas();

  // 区域
  for (const z of data.zones || []) {
    const zone = createZone({ title: z.title, x: z.x, y: z.y, w: z.w, h: z.h, color: z.color, level: z.level });
    // 保持原 id，以便节点归属引用一致
    const old = state.zones[zone.id];
    delete state.zones[zone.id];
    zone.id = z.id;
    zone.el.id = 'zone-' + z.id;
    state.zones[z.id] = zone;
    layoutZone(zone);
    void old;
  }

  // 节点
  for (const n of data.nodes || []) {
    const node = createNode(n.kind, {
      title: n.title, x: n.x, y: n.y, w: n.w, h: n.h,
      text: n.text, src: n.src, prompt: n.prompt,
      zoneId: n.zoneId, level: n.level,
    });
    // 保持原 id，保证连线引用一致
    const oldId = node.id;
    delete state.nodes[oldId];
    node.id = n.id;
    node.el.id = 'node-' + n.id;
    state.nodes[n.id] = node;
  }

  // 连线（此时节点都已就位）
  for (const e of data.edges || []) {
    if (!state.nodes[e.source] || !state.nodes[e.target]) continue;
    const edge = addEdge(e.source, e.target);
    edge.command = e.command || '';
  }

  // 任务
  seq.task = 0;
  state.tasks = {};
  for (const t of data.tasks || []) createTask(t.name, t.edgeIds);

  // 同步 seq 计数器，避免后续 id 冲突
  seq.node = Math.max(0, ...Object.keys(state.nodes).map(k => parseInt(String(k).replace(/\D/g, ''), 10) || 0));
  seq.edge = Math.max(0, ...Object.keys(state.edges).map(k => parseInt(String(k).replace(/\D/g, ''), 10) || 0));
  seq.zone = Math.max(0, ...Object.keys(state.zones).map(k => parseInt(String(k).replace(/\D/g, ''), 10) || 0));

  // 视图
  if (data.view) { view.x = data.view.x; view.y = data.view.y; view.scale = data.view.scale; }

  refreshAllZonePickers();
  applyView();
  redrawEdges();
  refreshOutline();
  refreshTasks();
  refreshSnapshot();
  DBG.log('画布已导入：', (data.nodes || []).length, '节点,', (data.edges || []).length, '连线');
  } finally {
    window.__silentImport = false;
  }
}

// 清空整个画布
function clearCanvas() {
  Object.values(state.edges).forEach(e => e.labelEl?.remove());
  Object.values(state.nodes).forEach(n => n.el?.remove());
  Object.values(state.zones).forEach(z => z.el?.remove());
  state.nodes = {}; state.edges = {}; state.zones = {};
  state.tasks = {}; state.selectedEdgeId = null; state.activeTaskId = null;
  state.filterZoneId = 'all';
  seq.node = 0; seq.edge = 0; seq.zone = 0; seq.task = 0;
  const msgs = document.getElementById('msgs');
  if (msgs) msgs.innerHTML = '';
  DBG.log('画布已清空');
}


// ---- localStorage 自动保存 ----
let autosaveTimer = null;
function autosaveCanvas() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    try {
      localStorage.setItem('mc_canvas', JSON.stringify(exportCanvasData()));
      DBG.log('已自动保存到本地');
    } catch (e) {
      // 通常是图片太大超出 localStorage 限额
      DBG.warn('自动保存失败（可能图片太大）：', e.message);
    }
  }, 500);
}

function restoreCanvas() {
  const raw = localStorage.getItem('mc_canvas');
  if (!raw) return false;
  try {
    importCanvasData(JSON.parse(raw));
    DBG.log('已从本地恢复上次画布');
    return true;
  } catch (e) {
    DBG.warn('本地画布恢复失败：', e.message);
    return false;
  }
}

// ---- 导出 / 导入文件 ----
function exportToFile() {
  const data = exportCanvasData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `canvas-${ts}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  DBG.log('已导出 JSON 文件');
}

async function importFromFile(file) {
  try {
    const text = await readAsText(file);
    const data = JSON.parse(text);
    importCanvasData(data);
    autosaveCanvas();
  } catch (e) {
    DBG.err('导入失败：', e);
    alert('导入失败：' + e.message);
  }
}

  document.addEventListener('keyup',   (e) => { if (e.code === 'Space') spaceDown = false; });
  canvas.addEventListener('pointerdown', (e) => {
    const onBlank = e.target.id === 'canvas' || e.target.id === 'world' || e.target.id === 'edges';
    if (!onBlank && !spaceDown) return;
    if (e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY, ox = view.x, oy = view.y;
    canvas.classList.add('panning');
    function onMove(ev) { view.x = ox + (ev.clientX - sx); view.y = oy + (ev.clientY - sy); applyView(); }
    function onUp() {
      canvas.classList.remove('panning');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  // ---- 滚轮缩放 ----
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });

  // ---- 触摸双指缩放（平板/手机）----
  const touches = new Map();   // pointerId -> {x, y}
  let pinchDist = 0;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || !touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2 && pinchDist > 0) {
      const [a, b] = [...touches.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 0) {
        const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
        zoomAt(cx, cy, d / pinchDist);
        pinchDist = d;
      }
    }
  });
  const endTouch = (e) => {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinchDist = 0;
  };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);

  // 点击空白处取消选中
  canvas.addEventListener('pointerdown', (e) => {
    if (e.target.id === 'canvas' || e.target.id === 'world' || e.target.id === 'edges') {
      state.selectedEdgeId = null;
      Object.values(state.nodes).forEach(n => n.el.classList.remove('selected'));
      redrawEdges();
    }
  });

  // 优先从本地恢复上次画布；没有则创建示例
  const restored = restoreCanvas();
  if (!restored) {
    const a = createNode('doc', { x: 100, y: 140, title: '文档',
      text: '人工智能正在改变世界。大语言模型可以写代码、做翻译、回答问题、总结长文。' +
            '它们通过海量文本训练，学会了语言的统计规律。在实际应用中，人们常常需要把长文档压缩成要点，' +
            '或者提炼出核心结论，以便快速阅读和决策。' });
    const b = createNode('output', { x: 620, y: 140, title: '输出' });
    const e1 = addEdge(a.id, b.id);
    e1.command = '🖐️总结';
    layoutEdgeLabel(e1);
    applyView();
    fitToContent();
  }

  refreshSnapshot();                    // 同步画布快照到侧边栏
  refreshOutline();                     // 初始化大纲
  loadTasks();                          // 载入已保存的任务
  refreshTasks();
  switchOlTab('outline');
  refreshLevelFilter();                 // 初始化层级过滤器
  addMsg('assistant',
    '你好，我能看到你当前的画布。可以问我：\n- 「概括当前图的结构」\n- 「N1 的内容讲了什么？」\n- 上传图片后「描述画布上的图片」',
    '助手');

  // 布局变化后重算连线（侧边栏折叠/展开、窗口尺寸变化）
  if (window.ResizeObserver) {
    new ResizeObserver(() => { redrawEdges(); drawMiniMap(); })
      .observe(document.getElementById('canvasWrap'));
  }

  window.addEventListener('resize', () => { redrawEdges(); drawMiniMap(); });

  // ---- 移动端/窄屏：默认折叠两侧栏，画布占满屏幕 ----
  if (window.matchMedia('(max-width: 768px)').matches) {
    document.getElementById('outline').classList.add('collapsed');
    document.getElementById('sidebar').classList.add('collapsed');
    requestAnimationFrame(() => { redrawEdges(); drawMiniMap(); });
  }

  DBG.log('初始化完成。左侧：大纲/任务；Alt+Enter 运行；区域=大纲层级。');
}


init();

</script>
</body>
</html>
