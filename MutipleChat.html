<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Canvas MVP · 节点 / 连线 / Alt+Enter 执行</title>
<style>
  :root {
    --bg: #f6f7f9;
    --node-bg: #ffffff;
    --border: #d5d7db;
    --accent: #4f46e5;
    --line: #9aa0a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  body { background: var(--bg); }

  #canvas { position: absolute; inset: 0; overflow: hidden; cursor: default; touch-action: none; }
  #canvas.panning { cursor: grabbing; }

  /* 布局：画布区 + 右侧侧边栏（flex） */
  #stage { position: absolute; inset: 0; display: flex; }
  #canvasWrap { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  #canvasWrap.dropping::after {
    content: '松开以导入文件'; position: absolute; inset: 12px; z-index: 40;
    border: 3px dashed var(--accent); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--accent);
    background: rgba(79,70,229,.06); pointer-events: none;
  }

  /* ---------- 左侧大纲栏 ---------- */
  #outline {
    position: relative; flex: 0 0 250px; width: 250px;
    background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-width: 0; z-index: 30;
  }
  #outline.collapsed { flex-basis: 0; width: 0; border-right: 0; overflow: hidden; }
  #outline.collapsed .ol-body, #outline.collapsed .ol-head { display: none; }
  .ol-head {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 12px; border-bottom: 1px solid #eceef1;
    font-size: 13px; font-weight: 700; color: #333;
  }
  .ol-head .spacer { flex: 1; }
  .ol-body { flex: 1; overflow-y: auto; padding: 8px; font-size: 12.5px; }

  /* 左侧 Tab */
  .ol-tabs {
    display: flex; border-bottom: 1px solid #eceef1; flex: none;
  }
  .ol-tab {
    flex: 1; text-align: center; padding: 9px 6px; font-size: 12.5px;
    font-weight: 600; color: #777; cursor: pointer; user-select: none;
    border-bottom: 2px solid transparent;
  }
  .ol-tab:hover { background: #f7f8fa; color: #333; }
  .ol-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .ol-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* 任务卡片 */
  .task-card {
    border: 1px solid #eceef1; border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  }
  .task-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,.12); }
  .task-head {
    display: flex; align-items: center; gap: 6px; padding: 7px 8px;
    background: #f7f8fa; cursor: pointer; font-weight: 600; color: #333;
  }
  .task-head:hover { background: #eef0f4; }
  .task-head .tname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-head .tcount { font-size: 11px; color: #999; }
  .task-head .trun {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .task-head .trun:hover { filter: brightness(1.1); }
  .task-lines { padding: 5px 8px 8px; }
  .task-line {
    display: flex; align-items: center; gap: 5px; font-size: 11.5px;
    color: #555; padding: 2px 0; cursor: pointer;
  }
  .task-line:hover { color: var(--accent); }
  .task-line input { margin: 0; }
  .task-empty { color: #b3b6bb; font-size: 12px; padding: 8px; font-style: italic; }
  .task-actions { display: flex; gap: 6px; padding: 0 8px 8px; }
  .task-actions button { padding: 3px 8px; font-size: 11px; background: #eef0f3; color: #444; }
  .task-actions button:hover { background: #e2e5ea; }
  .task-actions button.danger { color: #dc2626; }
  /* 连线标签上的“属于任务”标记 */
  .edge-label .task-dot { color: #f59e0b; margin-left: 4px; font-size: 10px; }

  /* 大纲条目 */
  .ol-zone { margin-bottom: 8px; border: 1px solid #eceef1; border-radius: 8px; overflow: hidden; }
  .ol-zone-head {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: #f7f8fa; cursor: pointer; font-weight: 600; color: #333;
  }
  .ol-zone-head:hover { background: #eef0f4; }
  .ol-zone-head .zcolor { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .ol-zone-head .ztitle { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ol-zone-head .zcount { font-size: 11px; color: #999; }
  .ol-items { padding: 4px; }
  .ol-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    border-radius: 6px; cursor: pointer; color: #444;
  }
  .ol-item:hover { background: #f0f1f4; }
  .ol-item.active { background: rgba(79,70,229,.12); color: var(--accent); font-weight: 600; }
  .ol-item .ikind { font-size: 11px; }
  .ol-item .iname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ol-empty { color: #b3b6bb; font-size: 12px; padding: 8px; font-style: italic; }

  /* 层级过滤器 */
  #levelFilter {
    display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 8px;
    border-bottom: 1px solid #eceef1;
  }
  .lvl-btn {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    background: #eef0f3; color: #555; cursor: pointer; border: 1px solid transparent;
    white-space: nowrap;
  }
  .lvl-btn:hover { background: #e2e5ea; }
  .lvl-btn.active { background: var(--accent); color: #fff; }

  #toggleOutline {
    position: absolute; left: 16px; top: 16px; z-index: 31;
    padding: 7px 12px; background: #fff; color: #333;
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  #toggleOutline:hover { background: #f5f6f8; }

  /* ---------- 区域（Zone）---------- */
  .zone {
    position: absolute; z-index: 0;
    border-radius: 14px; border: 2px dashed;
    pointer-events: none;
  }
  .zone .zone-bar {
    position: absolute; left: 0; top: 0; right: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 12px 12px 0 0;
    font-size: 12px; font-weight: 700; color: #fff;
    pointer-events: auto; cursor: grab; user-select: none;
  }
  .zone .zone-bar:active { cursor: grabbing; }
  .zone .zone-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone .zone-close {
    width: 16px; height: 16px; line-height: 14px; text-align: center;
    border-radius: 4px; cursor: pointer; opacity: .85;
  }
  .zone .zone-close:hover { background: rgba(255,255,255,.3); opacity: 1; }
  .zone .zone-resize {
    position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
    cursor: nwse-resize; pointer-events: auto;
  }
  /* 层级过滤时淡出不属于当前区域的内容 */
  .dim { opacity: .12; pointer-events: none !important; }
  .zone.dim { opacity: .06; }

  /* ---------- 执行节点 ---------- */
  .node[data-kind="exec"] {
    border-color: #7c3aed;
    box-shadow: 0 3px 14px rgba(124,58,237,.18);
  }
  .node[data-kind="exec"] .bar { background: #ede9fe; color: #5b21b6; }
  .node[data-kind="exec"] .dot { background: #7c3aed; }
  .node .exec-prompt {
    width: 100%; border: 0; outline: none; resize: none;
    padding: 8px 9px; font-size: 13px; line-height: 1.5;
    font-family: inherit; background: transparent; color: #222;
    border-bottom: 1px dashed #ddd;
  }
  .node .exec-prompt::placeholder { color: #b3b6bb; }
  .node .exec-out {
    flex: 1; min-height: 30px; padding: 8px 9px; font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; overflow-y: auto; color: #333; background: #faf9ff;
  }
  .node .exec-out.empty::before { content: "（执行结果）"; color: #b3b6bb; }
  .node .exec-inlabel {
    font-size: 10.5px; color: #8b5cf6; padding: 2px 9px 0; font-weight: 600;
  }
  /* 区域选择器（节点标题栏内）*/
  .node .zone-pick {
    font-size: 11px; border: 1px solid #ddd; border-radius: 5px;
    padding: 1px 4px; max-width: 78px; background: #fff; color: #555; cursor: pointer;
  }

  /* world：所有内容的坐标容器，通过 transform 实现缩放平移 */
  #world {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    width: 0; height: 0;
  }
  /* grid 背景随 world 移动 */
  #canvas::before {
    content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px);
    background-size: var(--grid, 24px) var(--grid, 24px);
    background-position: var(--gx, 0) var(--gy, 0);
  }

  /* ---------- 连线 SVG 层（在 world 内，覆盖很大的世界坐标范围）---------- */
  svg#edges {
    position: absolute; left: 0; top: 0;
    width: 100000px; height: 100000px;
    overflow: visible; pointer-events: none; z-index: 1;
  }
  svg#edges .wire { fill: none; stroke: var(--line); stroke-width: 2.5; pointer-events: stroke; cursor: pointer; }
  svg#edges .wire:hover { stroke: #6b7280; }
  svg#edges .wire.executable { stroke: var(--accent); stroke-width: 3.5; }
  svg#edges .wire.running { stroke: #f59e0b; stroke-dasharray: 6 5; animation: dash .6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -11; } }
  /* 临时拖拽预览线 */
  svg#edges .ghost { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; }

  /* 连线上的命令标签 —— 直接就地编辑 */
  .edge-label {
    position: absolute; z-index: 3;
    transform: translate(-50%, -50%);
    background: #fff; border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 7px; font-size: 12.5px; color: #444; white-space: nowrap;
    cursor: text; user-select: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .edge-label:hover { border-color: var(--accent); color: var(--accent); }
  .edge-label.executable { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .edge-label.placeholder { color: #b7bbc2; font-style: italic; }
  /* 编辑态：变成一个真正的输入框 */
  .edge-input {
    position: absolute; z-index: 10;
    transform: translate(-50%, -50%);
    border: 1.5px solid var(--accent); border-radius: 6px;
    padding: 2px 7px; font-size: 12.5px; outline: none;
    box-shadow: 0 2px 10px rgba(79,70,229,.25);
    min-width: 90px; text-align: center;
  }

  /* ---------- 节点 ---------- */
  .node {
    position: absolute; z-index: 2;
    display: flex; flex-direction: column;
    background: var(--node-bg);
    border: 1.5px solid var(--border); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    min-width: 120px; min-height: 80px;
    overflow: visible;
  }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.15), 0 2px 10px rgba(0,0,0,.06); }
  .node .bar {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; font-size: 12px; font-weight: 600; color: #555;
    background: #f0f1f3; border-radius: 8px 8px 0 0;
    cursor: grab; user-select: none;
  }
  .node .bar:active { cursor: grabbing; }
  .node .dot { width: 9px; height: 9px; border-radius: 50%; background: #c3c6cb; flex: none; }
  .node[data-kind="doc"]    .dot { background: #16a34a; }
  .node[data-kind="output"] .dot { background: #eab308; }
  .node .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .close {
    flex: none; width: 18px; height: 18px; line-height: 16px; text-align: center;
    border-radius: 4px; color: #999; cursor: pointer; font-weight: 700;
  }
  .node .close:hover { background: #e5e7eb; color: #dc2626; }

  .node .body { flex: 1; display: flex; min-height: 0; }
  .node textarea, .node .out {
    flex: 1; width: 100%; border: 0; outline: none; resize: none;
    padding: 9px; font-size: 13.5px; line-height: 1.6;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    background: transparent; color: #222;
  }
  .node .out { font-family: inherit; white-space: pre-wrap; overflow-y: auto; }
  .node .out.empty::before { content: "（执行结果会出现在这里）"; color: #b3b6bb; }

  /* 图片节点 */
  .node[data-kind="img"] .body { overflow: hidden; background:
    repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .node[data-kind="img"] img {
    width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none;
  }
  .node .img-drop {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b3b6bb; font-size: 12.5px; text-align: center; padding: 10px; pointer-events: none;
  }
  .node[data-kind="img"].has-img .img-drop { display: none; }
  .node.drop-target { outline: 3px dashed var(--accent); outline-offset: 2px; }

  /* ---------- 端口（连线锚点）---------- */
  .port {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent);
    top: 50%; transform: translateY(-50%);
    cursor: crosshair; z-index: 4;
  }
  .port:hover { background: var(--accent); transform: translateY(-50%) scale(1.25); }
  .port.in  { left: -8px; }
  .port.out { right: -8px; }

  /* 右下角缩放手柄 */
  .resize-handle {
    position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px;
    cursor: nwse-resize; z-index: 4;
    background: linear-gradient(135deg, transparent 50%, var(--border) 50%);
    border-radius: 0 0 8px 0;
  }
  .resize-handle:hover { background: linear-gradient(135deg, transparent 50%, var(--accent) 50%); }

  /* ---------- 工具栏 ---------- */
  #toolbar {
    position: absolute; left: 16px; bottom: 16px; z-index: 20;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: #fff; padding: 8px 10px; border-radius: 12px;
    box-shadow: 0 3px 16px rgba(0,0,0,.12); font-size: 13px; max-width: calc(100% - 32px);
  }
  button {
    border: 0; border-radius: 8px; padding: 7px 13px; font-size: 13px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  button:disabled { background: #b9bbc3; cursor: not-allowed; }
  button.ghost { background: #eef0f3; color: #333; }
  button.ghost:hover { background: #e2e5ea; }
  input.key {
    padding: 7px 9px; border: 1px solid #d5d7db; border-radius: 8px;
    font-size: 13px; width: 230px;
  }
  #hint { color: #777; font-size: 12px; line-height: 1.5; }
  kbd {
    background: #f0f1f3; border: 1px solid #d5d7db; border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: inherit;
  }

  /* 右下角视图控件 */
  #viewctl {
    position: absolute; right: 16px; bottom: 16px; z-index: 20;
    display: flex; gap: 6px; align-items: center;
    background: #fff; padding: 6px; border-radius: 10px;
    box-shadow: 0 3px 16px rgba(0,0,0,.12);
  }
  #viewctl button { padding: 6px 10px; background: #eef0f3; color: #333; }
  #viewctl button:hover { background: #e2e5ea; }
  #zoomLabel { font-size: 12px; color: #666; min-width: 42px; text-align: center; }

  /* 小地图 */
  #minimap {
    position: absolute; right: 16px; bottom: 66px; z-index: 19;
    width: 220px; height: 150px;
    background: rgba(255,255,255,.92); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 3px 16px rgba(0,0,0,.12);
    overflow: hidden; cursor: pointer;
  }
  #minimap.hidden { display: none; }
  #minimap canvas { display: block; width: 100%; height: 100%; }

  /* ---------- 侧边栏（对话 + 画布识别）---------- */
  #sidebar {
    position: relative; flex: 0 0 360px; width: 360px;
    background: #fff; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-width: 0; z-index: 30;
  }
  #sidebar.collapsed { flex-basis: 0; width: 0; border-left: 0; }
  #sidebar.collapsed .sb-body, #sidebar.collapsed .sb-head { display: none; }

  .sb-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid #eceef1;
    font-size: 13px; font-weight: 700; color: #333;
  }
  .sb-head .spacer { flex: 1; }
  .sb-head .chip {
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    background: rgba(79,70,229,.1); padding: 3px 8px; border-radius: 999px;
  }

  .sb-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* 画布快照预览区 */
  #snapshot {
    border-bottom: 1px solid #eceef1; background: #fafbfc;
    padding: 8px 12px; font-size: 12px; color: #666; max-height: 130px; overflow: auto;
  }
  #snapshot .snap-title { font-weight: 700; color: #444; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
  #snapshot pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.5; color: #555;
  }
  #snapshot .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #snapshot .thumbs img {
    width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border);
  }

  /* 消息列表 */
  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #f1f2f4; color: #222; border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #fee2e2; color: #991b1b; font-size: 12px; }
  .msg .meta { display: block; font-size: 10.5px; color: #8a8f98; margin-bottom: 3px; }
  .msg.user .meta { color: rgba(255,255,255,.75); }

  /* 输入区 */
  .sb-input { border-top: 1px solid #eceef1; padding: 10px 12px; }
  .sb-input textarea {
    width: 100%; min-height: 62px; max-height: 200px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
    font-size: 13px; font-family: inherit; line-height: 1.5; outline: none;
  }
  .sb-input textarea:focus { border-color: var(--accent); }
  .sb-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .sb-actions .grow { flex: 1; }
  .sb-actions label { font-size: 12px; color: #666; display: flex; gap: 4px; align-items: center; cursor: pointer; }

  /* 折叠/展开按钮 */
  #toggleSidebar {
    position: absolute; right: 16px; top: 16px; z-index: 31;
    padding: 7px 12px; background: #fff; color: #333;
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  #toggleSidebar:hover { background: #f5f6f8; }

  /* 轻提示 */
  #toast {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    z-index: 100; padding: 8px 16px; border-radius: 10px;
    background: #111827; color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  #toast.show { opacity: .95; }

/* =========================================================================
   移动端 / 平板适配（窄屏时侧栏改为浮层抽屉，画布全屏）
   ========================================================================= */
@media (max-width: 768px) {
  /* 侧栏脱离文档流，浮在画布上 */
  #outline, #sidebar {
    position: absolute; top: 0; bottom: 0; z-index: 50;
    width: min(78vw, 320px);
    box-shadow: 0 0 24px rgba(0,0,0,.18);
    transition: transform .22s ease;
  }
  #outline { left: 0; transform: translateX(0); border-right: 1px solid var(--border); }
  #sidebar { right: 0; transform: translateX(0); border-left: 1px solid var(--border); }

  /* 折叠 = 移出屏幕（保留宽度，便于动画） */
  #outline.collapsed, #sidebar.collapsed {
    flex-basis: min(78vw, 320px); width: min(78vw, 320px);
    border: 0; overflow: visible;
  }
  #outline.collapsed { transform: translateX(-102%); }
  #sidebar.collapsed { transform: translateX(102%); }
  /* 移动端折叠时仍显示内部内容（只是整体移出屏幕） */
  #outline.collapsed .ol-body, #outline.collapsed .ol-head,
  #sidebar.collapsed .sb-body, #sidebar.collapsed .sb-head { display: flex; }
  #outline.collapsed .ol-body, #sidebar.collapsed .sb-body { display: block; }

  /* 工具栏：缩小、允许换行、贴左上角 */
  #toolbar { flex-wrap: wrap; gap: 4px; padding: 6px; max-width: calc(100vw - 16px); }
  #toolbar button { font-size: 12px; padding: 6px 8px; }

  /* 节点内的端口/手柄加大，方便手指点中 */
  .port { width: 18px; height: 18px; }

  /* 小地图在窄屏隐藏（避免遮挡） */
  #minimap { display: none !important; }

  /* 输入框加大，防止 iOS 自动放大 */
  textarea, input, select { font-size: 16px; }
}

/* 触摸设备：禁用长按选择/系统菜单，提升拖动体验 */
@media (pointer: coarse) {

    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .port { touch-action: none; }
}

<script>
// ===== state.js ====================================================
// =========================================================================
// state.js —— 全局状态与常量（唯一的状态中心）
// 所有模块从这里 import 共享状态。
// =========================================================================

const PREFIX = '🖐️';
const API_URL = 'https://api.deepseek.com/chat/completions';

// 区域调色板（每个新区域依次取色）
const ZONE_COLORS = ['#0ea5e9', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#14b8a6', '#ec4899'];

// ---- 可变的 id 计数器 ----
// 用对象包裹，保证所有模块读到/写到的都是同一个引用
const seq = { node: 0, edge: 0, zone: 0, task: 0 };

// ---- 主状态 ----
const state = {
  nodes: {},   // id -> { id, kind, title, x, y, w, h, text, src, prompt, zoneId, el }
  edges: {},   // id -> { id, source, target, command, labelEl }
  zones: {},   // id -> { id, title, x, y, w, h, color, level, el }
  selectedEdgeId: null,
  filterZoneId: 'all',   // 层级过滤：'all' 或某个 zoneId
  tasks: {},             // id -> { id, name, edgeIds: [] }
  activeTaskId: null,
  olTab: 'outline',      // 左侧当前 Tab: 'outline' | 'tasks'
};

// ---- 视口（缩放 / 平移）----
const view = { x: 0, y: 0, scale: 1 };

// ---- 拖拽连线时的临时预览 { source, x1, y1, x2, y2 } ----
const linkState = { pending: null };

// =========================================================================
// 调试工具
// =========================================================================
const DBG = {
  enabled: true,
  lastRequest: null,
  on()  { this.enabled = true;  console.log('[DBG] 调试已开启'); },
  off() { this.enabled = false; console.log('[DBG] 调试已关闭'); },
  log(...a)  { if (this.enabled) console.log('%c[DBG]', 'color:#4f46e5;font-weight:bold', ...a); },
  warn(...a) { if (this.enabled) console.warn('%c[DBG]', 'color:#d97706;font-weight:bold', ...a); },
  err(...a)  { console.error('%c[DBG]', 'color:#dc2626;font-weight:bold', ...a); },
};

// 暴露到全局，方便控制台调试
if (typeof window !== 'undefined') {
  window.DBG = DBG;
  window.state = state;
  window.view = view;
}

// ---- 通用小工具 ----
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// 轻提示
let toastTimer = null;
function flashToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

// ===== viewport.js =================================================
function worldEl() { return document.getElementById('world'); }
function canvasEl() { return document.getElementById('canvas'); }

function applyView() {
  const w = worldEl();
  w.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  // 网格背景跟随
  const c = canvasEl();
  c.style.setProperty('--grid', (24 * view.scale) + 'px');
  c.style.setProperty('--gx', view.x + 'px');
  c.style.setProperty('--gy', view.y + 'px');
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = Math.round(view.scale * 100) + '%';
  drawMiniMap();
}

// 屏幕坐标 -> world 坐标
function screenToWorld(sx, sy) {
  const r = canvasEl().getBoundingClientRect();
  return {
    x: (sx - r.left - view.x) / view.scale,
    y: (sy - r.top  - view.y) / view.scale,
  };
}

function zoomAt(screenX, screenY, factor) {
  const r = canvasEl().getBoundingClientRect();
  const px = screenX - r.left, py = screenY - r.top;
  const wx = (px - view.x) / view.scale;
  const wy = (py - view.y) / view.scale;
  const next = Math.min(3, Math.max(0.15, view.scale * factor));
  view.scale = next;
  view.x = px - wx * next;
  view.y = py - wy * next;
  applyView();
}

function panBy(dx, dy) { view.x += dx; view.y += dy; applyView(); }

// 让所有内容居中且刚好容纳
function fitToContent(padding = 60) {
  const nodes = Object.values(state.nodes);
  if (!nodes.length) { view.x = 0; view.y = 0; view.scale = 1; applyView(); return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  const r = canvasEl().getBoundingClientRect();
  const cw = maxX - minX, ch = maxY - minY;
  const sx = (r.width  - padding * 2) / cw;
  const sy = (r.height - padding * 2) / ch;
  view.scale = Math.min(2, Math.max(0.15, Math.min(sx, sy)));
  view.x = (r.width  - cw * view.scale) / 2 - minX * view.scale;
  view.y = (r.height - ch * view.scale) / 2 - minY * view.scale;
  applyView();
}

// =========================================================================

// ===== minimap.js ==================================================
// 11.5 小地图（全局总览）
// =========================================================================
function contentBounds() {
  const nodes = Object.values(state.nodes);
  if (!nodes.length) return { minX: 0, minY: 0, maxX: 800, maxY: 600 };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  return { minX, minY, maxX, maxY };
}

// 小地图坐标换算（在 contentBounds 基础上加 padding）
function miniTransform() {
  const b = contentBounds();
  const pad = 80;
  const x0 = b.minX - pad, y0 = b.minY - pad;
  const w  = (b.maxX - b.minX) + pad * 2;
  const h  = (b.maxY - b.minY) + pad * 2;
  const cv = document.querySelector('#minimap canvas');
  const cw = cv.clientWidth, ch = cv.clientHeight;
  const s = Math.min(cw / w, ch / h);
  const ox = (cw - w * s) / 2, oy = (ch - h * s) / 2;
  return { x0, y0, s, ox, oy };
}

function drawMiniMap() {
  const map = document.getElementById('minimap');
  if (map.classList.contains('hidden')) return;
  const cv = map.querySelector('canvas');
  const dpr = window.devicePixelRatio || 1;
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if (cv.width !== cw * dpr) { cv.width = cw * dpr; cv.height = ch * dpr; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  const { x0, y0, s, ox, oy } = miniTransform();
  const W = (wx) => (wx - x0) * s + ox;
  const H = (wy) => (wy - y0) * s + oy;

  // 连线
  ctx.strokeStyle = '#c7cad0'; ctx.lineWidth = 1;
  for (const e of Object.values(state.edges)) {
    const a = state.nodes[e.source], b = state.nodes[e.target];
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(W(a.x + a.w), H(a.y + a.h / 2));
    ctx.lineTo(W(b.x), H(b.y + b.h / 2));
    ctx.stroke();
  }

  // 节点
  const colors = { doc: '#16a34a', output: '#eab308', img: '#0ea5e9' };
  for (const n of Object.values(state.nodes)) {
    ctx.fillStyle = (colors[n.kind] || '#999') + '33';
    ctx.strokeStyle = colors[n.kind] || '#999';
    ctx.lineWidth = 1.5;
    const rx = W(n.x), ry = H(n.y), rw = n.w * s, rh = n.h * s;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(rx, ry, rw, rh, 2); else ctx.rect(rx, ry, rw, rh);
    ctx.fill(); ctx.stroke();
  }

  // 当前视口矩形
  const r = canvasEl().getBoundingClientRect();
  const tl = screenToWorld(r.left, r.top);
  const vx = W(tl.x), vy = H(tl.y), vw = (r.width / view.scale) * s, vh = (r.height / view.scale) * s;
  ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 1.5;
  ctx.fillStyle = 'rgba(79,70,229,.08)';
  ctx.beginPath(); ctx.rect(vx, vy, vw, vh); ctx.fill(); ctx.stroke();
}

// 点击小地图跳转视口
function bindMiniMapClick() {
  const map = document.getElementById('minimap');
  map.addEventListener('pointerdown', (e) => {
    const cv = map.querySelector('canvas');
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const { x0, y0, s, ox, oy } = miniTransform();
    const wx = (px - ox) / s + x0;
    const wy = (py - oy) / s + y0;
    const cr = canvasEl().getBoundingClientRect();
    view.x = cr.width  / 2 - wx * view.scale;
    view.y = cr.height / 2 - wy * view.scale;
    applyView();
  });
}

// =========================================================================

// ===== zones.js ====================================================
// 1.8 区域（Zone）—— 大纲的层级单位
// =========================================================================
function createZone(opts = {}) {
  const id = 'z' + (++seq.zone);
  const color = opts.color || ZONE_COLORS[(seq.zone - 1) % ZONE_COLORS.length];
  const zone = {
    id,
    title: opts.title || ('区域 ' + seq.zone),
    x: opts.x ?? 60 + (seq.zone % 4) * 30,
    y: opts.y ?? 60 + (seq.zone % 4) * 30,
    w: opts.w ?? 420,
    h: opts.h ?? 300,
    color,
    level: opts.level ?? 1,
    el: null,
  };
  state.zones[id] = zone;
  renderZone(zone);
  layoutZone(zone);
  if (!window.__silentImport) {
    refreshAllZonePickers();    // 新区域要出现在所有节点的下拉里
    refreshOutline();
    window.scheduleSnapshot?.();
  }
  DBG.log('创建区域', id, zone.title);
  return zone;
}

function removeZone(id) {
  const z = state.zones[id];
  if (!z) return;
  // 区域内节点解除归属（不删节点）
  Object.values(state.nodes).forEach(n => { if (n.zoneId === id) n.zoneId = null; });
  if (state.filterZoneId === id) state.filterZoneId = 'all';
  z.el.remove();
  delete state.zones[id];
  refreshAllZonePickers();    // 从下拉里移除该区域
  refreshOutline();
  applyFilter();
  DBG.log('删除区域', id);
}

function renderZone(zone) {
  const el = document.createElement('div');
  el.className = 'zone';
  el.id = 'zone-' + zone.id;
  el.innerHTML = `
    <div class="zone-bar">
      <span class="zone-title"></span>
      <span class="zone-close" title="删除区域">×</span>
    </div>
    <div class="zone-resize"></div>
  `;
  const bar = el.querySelector('.zone-bar');
  bar.style.background = zone.color;

  // 拖动区域
  bar.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('zone-close')) return;
    e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, ox = zone.x, oy = zone.y;
    const zoneNodes = nodesInZone(zone.id);
    // 用累积位移避免重复叠加
    let lastDx = 0, lastDy = 0;
    function onMove2(ev) {
      const dx = (ev.clientX - sx) / view.scale;
      const dy = (ev.clientY - sy) / view.scale;
      zone.x = ox + dx; zone.y = oy + dy;
      layoutZone(zone);
      const stepX = dx - lastDx, stepY = dy - lastDy;
      lastDx = dx; lastDy = dy;
      for (const n of zoneNodes) { n.x += stepX; n.y += stepY; layoutNode(n); }
      redrawEdges();
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove2);
      window.removeEventListener('pointerup', onUp);
      window.scheduleSnapshot?.();   // 区域拖动结束保存
    }
    window.addEventListener('pointermove', onMove2);
    window.addEventListener('pointerup', onUp);
  });

  el.querySelector('.zone-close').addEventListener('click', (e) => {
    e.stopPropagation();
    removeZone(zone.id);
  });

  // 缩放手柄
  el.querySelector('.zone-resize').addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ow = zone.w, oh = zone.h;
    function onMove(ev) {
      zone.w = Math.max(160, ow + (ev.clientX - sx) / view.scale);
      zone.h = Math.max(120, oh + (ev.clientY - sy) / view.scale);
      layoutZone(zone);
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.scheduleSnapshot?.();   // 区域缩放结束保存
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  // 双击标题改名
  el.querySelector('.zone-title').addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const t = prompt('区域名称（大纲章节名）：', zone.title);
    if (t !== null) { zone.title = t; el.querySelector('.zone-title').textContent = t; refreshOutline(); }
  });

  // 区域节点挂到 world 的最底层（z-index 最低）
  worldEl().insertBefore(el, worldEl().firstChild);
  zone.el = el;
}

function layoutZone(zone) {
  const el = zone.el;
  if (!el) return;
  el.style.left = zone.x + 'px';
  el.style.top = zone.y + 'px';
  el.style.width = zone.w + 'px';
  el.style.height = zone.h + 'px';
  el.style.borderColor = zone.color;
  el.style.background = zone.color + '14';
  el.querySelector('.zone-title').textContent = zone.title;
}

function nodesInZone(zoneId) {
  return Object.values(state.nodes).filter(n => n.zoneId === zoneId);
}

// ===== outline.js ==================================================
// -------- 层级过滤：只显示某个区域（或全部）--------
function applyFilter() {
  const f = state.filterZoneId;
  const showAll = f === 'all';

  // 节点：属于当前区域的显示，其他淡出
  for (const n of Object.values(state.nodes)) {
    const visible = showAll || n.zoneId === f;
    n.el.classList.toggle('dim', !visible);
  }
  // 区域：非当前区域淡出
  for (const z of Object.values(state.zones)) {
    const visible = showAll || z.id === f;
    z.el.classList.toggle('dim', !visible);
  }
  // 连线：两端都可见才显示，否则淡出
  for (const e of Object.values(state.edges)) {
    const a = state.nodes[e.source], b = state.nodes[e.target];
    const visible = showAll
      || ((a && a.zoneId === f) && (b && b.zoneId === f));
    if (e.pathEl) e.pathEl.classList.toggle('dim', !visible);
    if (e.labelEl) e.labelEl.classList.toggle('dim', !visible);
  }
  refreshLevelFilter();
  DBG.log('层级过滤 ->', showAll ? '全部' : (state.zones[f]?.title || f));
}

// -------- 大纲栏 --------
function refreshOutline() {
  const body = document.getElementById('outlineBody');
  if (!body) return;
  const zones = Object.values(state.zones);
  const html = [];

  for (const z of zones) {
    const items = nodesInZone(z.id);
    html.push(`<div class="ol-zone">`);
    html.push(`<div class="ol-zone-head" data-zone="${z.id}">`);
    html.push(`<span class="zcolor" style="background:${z.color}"></span>`);
    html.push(`<span class="ztitle">${escapeHtml(z.title)}</span>`);
    html.push(`<span class="zcount">${items.length}</span>`);
    html.push(`</div>`);
    html.push(`<div class="ol-items">`);
    if (!items.length) html.push(`<div class="ol-empty">（无节点）</div>`);
    for (const n of items) html.push(outlineItem(n));
    html.push(`</div></div>`);
  }

  // 未分类节点
  const loose = Object.values(state.nodes).filter(n => !n.zoneId);
  html.push(`<div class="ol-zone">`);
  html.push(`<div class="ol-zone-head" data-zone="">`);
  html.push(`<span class="zcolor" style="background:#c3c6cb"></span>`);
  html.push(`<span class="ztitle">未分类</span>`);
  html.push(`<span class="zcount">${loose.length}</span>`);
  html.push(`</div><div class="ol-items">`);
  if (!loose.length) html.push(`<div class="ol-empty">（无）</div>`);
  for (const n of loose) html.push(outlineItem(n));
  html.push(`</div></div>`);

  body.innerHTML = html.join('');

  // 点击区域标题 -> 聚焦该区域
  body.querySelectorAll('.ol-zone-head').forEach(h => {
    h.addEventListener('click', () => {
      const zid = h.dataset.zone;
      if (zid && state.zones[zid]) focusZone(zid);
      else fitToContent();
    });
  });
  // 点击节点 -> 选中并聚焦
  body.querySelectorAll('.ol-item').forEach(it => {
    it.addEventListener('click', () => {
      const nid = it.dataset.node;
      if (state.nodes[nid]) focusNode(nid);
    });
  });
}

const KIND_ICON = { doc: '📄', output: '🎯', img: '🖼️', exec: '⚙️' };
function outlineItem(n) {
  const label = (n.kind === 'img'
    ? (n.src ? '图片' : '空图片')
    : n.kind === 'exec'
      ? (n.prompt ? n.prompt.slice(0, 20) : '执行节点')
      : ((n.text || '').trim().slice(0, 20) || '（空）'));
  return `<div class="ol-item" data-node="${n.id}">
    <span class="ikind">${KIND_ICON[n.kind] || '⬜'}</span>
    <span class="iname">${escapeHtml(label)}</span>
  </div>`;
}

// -------- 层级过滤器 UI --------
function refreshLevelFilter() {
  const bar = document.getElementById('levelFilter');
  if (!bar) return;
  const zones = Object.values(state.zones);
  const btns = [`<span class="lvl-btn ${state.filterZoneId === 'all' ? 'active' : ''}" data-f="all">全部</span>`];
  for (const z of zones) {
    btns.push(`<span class="lvl-btn ${state.filterZoneId === z.id ? 'active' : ''}" data-f="${z.id}">${escapeHtml(z.title)}</span>`);
  }
  bar.innerHTML = btns.join('');
  bar.querySelectorAll('.lvl-btn').forEach(b => {
    b.addEventListener('click', () => {
      state.filterZoneId = b.dataset.f;
      applyFilter();
    });
  });
}

// 聚焦到某个区域（居中显示）
function focusZone(zid) {
  const z = state.zones[zid];
  if (!z) return;
  const r = canvasEl().getBoundingClientRect();
  const pad = 40;
  const sx = (r.width - pad * 2) / z.w, sy = (r.height - pad * 2) / z.h;
  view.scale = Math.min(2, Math.max(0.15, Math.min(sx, sy)));
  view.x = (r.width - z.w * view.scale) / 2 - z.x * view.scale;
  view.y = (r.height - z.h * view.scale) / 2 - z.y * view.scale;
  applyView();
}

// 聚焦到某个节点
function focusNode(nid) {
  const n = state.nodes[nid];
  if (!n) return;
  selectNode(nid);
  const r = canvasEl().getBoundingClientRect();
  view.x = r.width / 2 - (n.x + n.w / 2) * view.scale;
  view.y = r.height / 2 - (n.y + n.h / 2) * view.scale;
  applyView();
}

// =========================================================================

// ===== nodes.js ====================================================
// 2. 节点增删
// =========================================================================
function createNode(kind, opts = {}) {
  const id = 'n' + (++seq.node);
  const titles = { output: '输出', img: '图片', doc: '文档', exec: '执行' };
  const node = {
    id,
    kind,                                  // 'doc' | 'output' | 'img' | 'exec'
    title: opts.title || titles[kind] || '节点',
    x: opts.x ?? (80 + (seq.node % 6) * 40),
    y: opts.y ?? (80 + (seq.node % 6) * 40),
    w: opts.w ?? (kind === 'img' ? 240 : kind === 'exec' ? 320 : 300),
    h: opts.h ?? (kind === 'img' ? 200 : kind === 'exec' ? 220 : 160),
    text: opts.text ?? '',
    src: opts.src ?? '',                   // 图片节点的 dataURL
    prompt: opts.prompt ?? '',             // 执行节点的提示词（写在节点内）
    zoneId: opts.zoneId ?? null,           // 手动归属的区域
    level: opts.level ?? 1,                // 大纲层级（预留）
    el: null,
  };
  state.nodes[id] = node;
  renderNode(node);                        // 创建 DOM
  layoutNode(node);
  if (!window.__silentImport) refreshOutline();
  DBG.log('创建节点', id, kind, 'zone=', node.zoneId);
  if (!window.__silentImport) window.scheduleSnapshot?.();
  return node;
}

function removeNode(id) {
  const node = state.nodes[id];
  if (!node) return;
  // 删除所有与之相连的边
  Object.values(state.edges)
    .filter(e => e.source === id || e.target === id)
    .forEach(e => removeEdge(e.id));
  node.el.remove();
  delete state.nodes[id];
  refreshOutline();
  DBG.log('删除节点', id);
}

function removeEdge(id) {
  const e = state.edges[id];
  if (!e) return;
  e.labelEl?.remove();
  if (state.selectedEdgeId === id) state.selectedEdgeId = null;
  delete state.edges[id];
  DBG.log('删除连线', id);
}

// =========================================================================
// 3. 节点 DOM 创建与布局
// =========================================================================
function renderNode(node) {
  const el = document.createElement('div');
  el.className = 'node';
  el.id = 'node-' + node.id;
  el.dataset.kind = node.kind;
  el.innerHTML = `
    <div class="bar">
      <span class="dot"></span>
      <span class="title"></span>
      <select class="zone-pick" title="归属区域（大纲章节）"></select>
      <span class="close" title="删除节点">×</span>
    </div>
    <div class="body"></div>
    <div class="port in"  title="输入"></div>
    <div class="port out" title="拖我连线"></div>
    <div class="resize-handle" title="拖拽调整大小"></div>
  `;
  el.querySelector('.title').textContent = node.title;

  const body = el.querySelector('.body');
  if (node.kind === 'img') {
    // 图片节点：支持文件选择 / 拖拽 / 粘贴
    const img = document.createElement('img');
    img.alt = '';
    if (node.src) { img.src = node.src; el.classList.add('has-img'); }
    const drop = document.createElement('div');
    drop.className = 'img-drop';
    drop.textContent = '拖入 / 点击选择 / 粘贴图片';
    drop.title = '图片节点可作为连线源，交给视觉模型识别';
    body.appendChild(img);
    body.appendChild(drop);
    node.imgEl = img;
    el.addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => inp.files[0] && loadImageFile(node, inp.files[0]);
      inp.click();
    });
    el.addEventListener('dragover', (e) => {
      if (e.dataTransfer?.types?.includes('Files')) {
        e.preventDefault(); el.classList.add('drop-target');
      }
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
    el.addEventListener('drop', (e) => {
      const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/'));
      if (f) { e.preventDefault(); e.stopPropagation(); el.classList.remove('drop-target'); loadImageFile(node, f); }
    });
    // 粘贴（聚焦该节点时）
    el.addEventListener('paste', (e) => {
      const f = [...(e.clipboardData?.items || [])]
        .find(i => i.type.startsWith('image/'))?.getAsFile();
      if (f) { e.preventDefault(); loadImageFile(node, f); }
    });
    el.tabIndex = 0;
  } else if (node.kind === 'output') {
    const out = document.createElement('div');
    out.className = 'out empty';
    out.contentEditable = 'true';           // 允许手动改
    body.appendChild(out);
    node.textEl = out;
    out.addEventListener('input', () => {
      node.text = out.textContent;
      out.classList.toggle('empty', !node.text);
      window.scheduleSnapshot?.();
    });
  } else if (node.kind === 'exec') {
    // 执行节点：上方提示词（写在节点内），下方执行结果
    const inlabel = document.createElement('div');
    inlabel.className = 'exec-inlabel';
    inlabel.textContent = '提示词（多输入聚合）';
    const prompt = document.createElement('textarea');
    prompt.className = 'exec-prompt';
    prompt.placeholder = '例如：对比以下多段内容，提炼共同结论…';
    prompt.value = node.prompt || '';
    prompt.addEventListener('input', () => {
      node.prompt = prompt.value;
      window.scheduleSnapshot?.();
    });
    const out = document.createElement('div');
    out.className = 'exec-out empty';
    body.appendChild(prompt);
    body.appendChild(out);
    node.promptEl = prompt;
    node.textEl = out;      // 结果写入这里
    body.style.flexDirection = 'column';
    // 把标签放到最前（在 body 之前展示）
    body.parentNode.insertBefore(inlabel, body);
    // 执行节点可点击自身运行
    el.querySelector('.title').addEventListener('dblclick', (e) => {
      e.stopPropagation(); runExecNode(node.id);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.placeholder = '在这里输入文档内容…';
    ta.value = node.text;
    body.appendChild(ta);
    node.textEl = ta;
    ta.addEventListener('input', () => {
      node.text = ta.value;
      window.scheduleSnapshot?.();
      redrawEdges();                        // 内容变化可能改变节点尺寸，重画连线
    });
  }

  // 移动 + 选中
  const bar = el.querySelector('.bar');
  bar.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('close')) return;
    selectNode(node.id);
    startDrag(e, node);
  });
  el.addEventListener('pointerdown', () => selectNode(node.id));

  // 删除节点
  el.querySelector('.close').addEventListener('click', (e) => {
    e.stopPropagation();
    removeNode(node.id);
    redrawEdges();
    window.scheduleSnapshot?.();
  });

  // 尾部端口：从这里拖出连线
  el.querySelector('.port.out').addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    startLinkFrom(node, e);
  });
  // 头部端口：可在此结束连线（也支持直接落在节点上）
  el.querySelector('.port.in').addEventListener('pointerup', (e) => {
    e.stopPropagation();
    finishLinkTo(node);
  });
  el.addEventListener('pointerup', () => finishLinkTo(node));

  // 缩放手柄
  el.querySelector('.resize-handle').addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    startResize(e, node);
  });

  // 区域选择器：手动指定节点归属哪个区域（大纲章节）
  const pick = el.querySelector('.zone-pick');
  pick.addEventListener('pointerdown', (e) => e.stopPropagation());
  pick.addEventListener('change', () => {
    node.zoneId = pick.value || null;
    DBG.log('节点', node.id, '归属区域 ->', node.zoneId);
    refreshOutline();
    applyFilter();
    window.scheduleSnapshot?.();
  });
  node.zonePickEl = pick;

  worldEl().appendChild(el);   // 节点进入 world 坐标系
  node.el = el;
  refreshZonePicker(node);     // 初始化下拉选项
}

// 刷新单个节点的区域下拉选项（区域增删后调用）
function refreshZonePicker(node) {
  const pick = node.zonePickEl;
  if (!pick) return;
  const cur = node.zoneId || '';
  const opts = ['<option value="">未分类</option>'];
  for (const z of Object.values(state.zones)) {
    opts.push(`<option value="${z.id}">${escapeHtml(z.title)}</option>`);
  }
  pick.innerHTML = opts.join('');
  pick.value = state.zones[cur] ? cur : '';
  if (cur && !state.zones[cur]) node.zoneId = null;
}

function refreshAllZonePickers() {
  Object.values(state.nodes).forEach(refreshZonePicker);
}


// 把图片文件读成 dataURL 挂到图片节点上
function loadImageFile(node, file) {
  const reader = new FileReader();
  reader.onload = () => {
    node.src = reader.result;
    node.imgEl.src = node.src;
    node.el.classList.add('has-img');
    window.scheduleSnapshot?.();
    DBG.log('图片载入', node.id, file.name, Math.round(file.size / 1024) + 'KB');
  };
  reader.readAsDataURL(file);
}

function layoutNode(node) {
  const el = node.el;
  if (!el) return;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  el.style.width = node.w + 'px';
  el.style.height = node.h + 'px';
}

function selectNode(id) {
  Object.values(state.nodes).forEach(n => n.el.classList.toggle('selected', n.id === id));
}

// =========================================================================
// 4. 拖拽移动
// =========================================================================
function startDrag(e, node) {
  const startX = e.clientX, startY = e.clientY;
  const origX = node.x, origY = node.y;
  function onMove(ev) {
    // 除以 scale：鼠标在屏幕上动 1px，节点在 world 中只应动 1/scale
    node.x = origX + (ev.clientX - startX) / view.scale;
    node.y = origY + (ev.clientY - startY) / view.scale;
    layoutNode(node);
    redrawEdges();
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.scheduleSnapshot?.();   // 拖动结束保存位置
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// =========================================================================
// 5. 拖拽缩放
// =========================================================================
function startResize(e, node) {
  const startX = e.clientX, startY = e.clientY;
  const ow = node.w, oh = node.h;
  function onMove(ev) {
    // 同样按 scale 换算
    node.w = Math.max(120, ow + (ev.clientX - startX) / view.scale);
    node.h = Math.max(80,  oh + (ev.clientY - startY) / view.scale);
    layoutNode(node);
    redrawEdges();
    layoutEdgeLabel(node);      // 若此节点是端点，标签位置也要更新
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.scheduleSnapshot?.();   // 缩放结束保存尺寸
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

// =========================================================================

// ===== edges.js ====================================================
// 6. 连线：从端口拖出
// =========================================================================
function startLinkFrom(node, e) {
  // 用 world 坐标（因为预览线画在 #edges 里，而 #edges 在 #world 中）
  function endpointXY(ofNode) {
    return { x: ofNode.x + ofNode.w, y: ofNode.y + ofNode.h / 2 };
  }
  const s = endpointXY(node);
  const p = screenToWorld(e.clientX, e.clientY);
  linkState.pending = { source: node.id, x1: s.x, y1: s.y, x2: p.x, y2: p.y };
  function onMove(ev) {
    if (!linkState.pending) return;
    const q = screenToWorld(ev.clientX, ev.clientY);
    linkState.pending.x2 = q.x;
    linkState.pending.y2 = q.y;
    drawGhost(linkState.pending);
  }
  function onUp(ev) {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    // 若松开时落在某个节点上，则正式建边
    const target = findNodeAt(ev.clientX, ev.clientY);
    linkState.pending = null;
    drawGhost(null);
    if (target && target.id !== node.id) {
      addEdge(node.id, target.id);
    } else {
      DBG.log('连线取消（未落在有效节点上）');
    }
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

function finishLinkTo(node) {
  // 由 linkState.pending 的 mouseup 处理，这里作为兜底入口（端口松手）
  // 实际逻辑在 startLinkFrom 的 onUp 中，通过坐标命中判断。
  void node;
}

function findNodeAt(cx, cy) {
  for (const n of Object.values(state.nodes)) {
    const r = n.el.getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return n;
  }
  return null;
}

function addEdge(source, target) {
  // 允许重复连线（同一对节点可有多条不同命令的线）
  const id = 'e' + (++seq.edge);
  const edge = { id, source, target, command: '', labelEl: null };
  state.edges[id] = edge;
  createEdgeLabel(edge);
  if (!window.__silentImport) redrawEdges();
  DBG.log('创建连线', id, source, '->', target);
  if (!window.__silentImport) window.scheduleSnapshot?.();
  return edge;
}

// =========================================================================
// 7. 连线渲染
// =========================================================================
function edgeGeometry(edge) {
  const a = state.nodes[edge.source];
  const b = state.nodes[edge.target];
  if (!a || !b) return null;
  // 直接使用 world 坐标（节点在 world 中，边也画在 world 中）
  const x1 = a.x + a.w, y1 = a.y + a.h / 2;
  const x2 = b.x,       y2 = b.y + b.h / 2;
  return { x1, y1, x2, y2 };
}

function edgePath({ x1, y1, x2, y2 }) {
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

function redrawEdges() {
  const svg = document.getElementById('edges');
  svg.innerHTML = '';
  for (const edge of Object.values(state.edges)) {
    const g = edgeGeometry(edge);
    if (!g) continue;
    const executable = edge.command.trim().startsWith(PREFIX);
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', edgePath(g));
    p.setAttribute('class', 'wire'
      + (executable ? ' executable' : '')
      + (state.selectedEdgeId === edge.id ? ' selected' : '')
      + (edge.running ? ' running' : ''));
    p.dataset.edge = edge.id;
    p.addEventListener('click', () => selectEdge(edge.id));
    p.addEventListener('dblclick', () => editEdgeLabel(edge));
    svg.appendChild(p);
    edge.pathEl = p;
    layoutEdgeLabel(edge);
  }
  drawMiniMap();
  applyFilter();   // 重画后重新应用层级过滤（淡出非当前层）
}

function drawGhost(link) {
  const svg = document.getElementById('edges');
  let ghost = svg.querySelector('.ghost');
  if (!link) { ghost?.remove(); return; }
  if (!ghost) {
    ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ghost.setAttribute('class', 'ghost');
    svg.appendChild(ghost);
  }
  ghost.setAttribute('d', edgePath(link));
}

// =========================================================================
// 8. 连线命令标签（就地编辑，不弹窗）
// =========================================================================
function createEdgeLabel(edge) {
  const el = document.createElement('div');
  el.className = 'edge-label placeholder';
  el.textContent = '+ 命令';
  worldEl().appendChild(el);       // 标签也进入 world 坐标系，随缩放平移
  edge.labelEl = el;

  el.addEventListener('click', (e) => { e.stopPropagation(); selectEdge(edge.id); });
  el.addEventListener('dblclick', (e) => { e.stopPropagation(); editEdgeLabel(edge); });
}

function layoutEdgeLabel(edge) {
  if (!edge.labelEl) return;
  const g = edgeGeometry(edge);
  if (!g) return;
  // edgeGeometry 已是 world 坐标，标签又定位在 #world 内，直接用 mid 坐标
  const mx = (g.x1 + g.x2) / 2;
  const my = (g.y1 + g.y2) / 2;
  edge.labelEl.style.left = mx + 'px';
  edge.labelEl.style.top = my + 'px';

  const cmd = edge.command.trim();
  const executable = cmd.startsWith(PREFIX);
  let text;
  if (cmd) {
    text = escapeHtml(cmd);
    edge.labelEl.classList.remove('placeholder');
  } else {
    text = '+ 命令';
    edge.labelEl.classList.add('placeholder');
  }
  // 若属于当前激活任务，加个小标记
  if (edgeInActiveTask(edge.id)) text += '<span class="task-dot" title="属于当前任务">●</span>';
  edge.labelEl.innerHTML = text;
  edge.labelEl.classList.toggle('executable', executable);
}

function selectEdge(id) {
  // 若当前正在“任务”Tab 且已选中一个任务，则点击连线 = 切换它是否属于该任务
  if (state.olTab === 'tasks' && state.activeTaskId && state.tasks[state.activeTaskId]) {
    toggleEdgeInTask(state.activeTaskId, id);
    DBG.log('切换连线', id, '在任务', state.activeTaskId, '中的归属');
  }
  state.selectedEdgeId = id;
  redrawEdges();
  DBG.log('选中连线', id, '命令=', JSON.stringify(state.edges[id]?.command));
}

// 某条线是否属于当前激活任务
function edgeInActiveTask(edgeId) {
  const t = state.tasks[state.activeTaskId];
  return !!(t && t.edgeIds.includes(edgeId));
}

// 就地编辑：把标签替换成一个 input
function editEdgeLabel(edge) {
  if (edge._editing) return;
  edge._editing = true;
  const label = edge.labelEl;
  const input = document.createElement('input');
  input.className = 'edge-input';
  input.value = edge.command;
  input.placeholder = '🖐️总结';
  input.style.left = label.style.left;
  input.style.top = label.style.top;
  label.style.visibility = 'hidden';
  worldEl().appendChild(input);           // 输入框也放进 world
  input.style.transform = `translate(-50%, -50%) scale(${1 / view.scale})`;
  input.focus();
  input.select();

  let done = false;
  const commit = (save) => {
    if (done) return;
    done = true;
    edge._editing = false;
    if (save) {
      edge.command = input.value;
      DBG.log('命令更新:', JSON.stringify(edge.command),
              '| 可执行=', edge.command.trim().startsWith(PREFIX));
      window.scheduleSnapshot?.();
    }
    input.remove();
    label.style.visibility = 'visible';
    redrawEdges();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.altKey) { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    // Alt+Enter 在编辑中：保存并立即执行
    else if (e.key === 'Enter' && e.altKey) { e.preventDefault(); commit(true); runEdge(edge.id); }
  });
  input.addEventListener('blur', () => commit(true));
}

// =========================================================================

// ===== exec.js =====================================================
// 9. 执行核心
// =========================================================================
async function runEdge(edgeId) {
  const edge = state.edges[edgeId];
  if (!edge) { DBG.warn('runEdge: 连线不存在', edgeId); return; }

  DBG.log('========== runEdge', edgeId, '开始 ==========');
  const cmd = edge.command.trim();
  DBG.log('命令 =', JSON.stringify(cmd));
  if (!cmd.startsWith(PREFIX)) {
    DBG.warn('命令未以 ' + PREFIX + ' 开头，跳过');
    flashEdge(edge, 'skip');
    return;
  }
  const promptText = cmd.slice(PREFIX.length).trim();
  DBG.log('promptText =', JSON.stringify(promptText));

  const src = state.nodes[edge.source];
  const dst = state.nodes[edge.target];
  if (!src || !dst) { DBG.err('端点节点不存在'); return; }
  const doc = src.text || '';
  // 源节点如果含图片，把 dataURL 一起带去（视觉模型可识别）
  const images = [];
  if (src.kind === 'img' && src.src) images.push(src.src);
  DBG.log('输入文档长度 =', doc.length, '前50字 =', JSON.stringify(doc.slice(0, 50)),
          '| 图片数 =', images.length);
  // 源节点既无文字也无图片 → 没东西可处理
  if (!doc && images.length === 0) {
    DBG.warn('源节点既无文字也无图片，跳过');
    flashEdge(edge, 'skip');
    return;
  }

  const key = document.getElementById('apiKey').value.trim()
    || localStorage.getItem('deepseek_key') || '';
  if (!key) { alert('请先填写 DeepSeek API Key'); return; }

  setOutput(dst, '');
  dst.textEl.classList.remove('empty');
  edge.running = true;
  redrawEdges();
  const outText = await streamLLM({ key, promptText, doc, images, onDelta: (t) => setOutput(dst, t) });
  edge.running = false;
  redrawEdges();
  DBG.log('========== runEdge', edgeId, '结束，输出', outText.length, '字符 ==========');
}

function setOutput(node, text) {
  node.text = text;
  if (node.kind === 'output') {
    node.textEl.textContent = text;
    node.el.querySelector('.out').classList.toggle('empty', !text);
  } else if (node.kind === 'doc') {
    // 目标是文档节点：直接覆盖文本
    node.textEl.value = text;
  } else if (node.kind === 'exec') {
    // 目标是执行节点：写入其结果区（使得一个执行节点的输出可被下游继续使用）
    if (node.textEl) {
      node.textEl.textContent = text;
      node.textEl.classList.toggle('empty', !text);
    }
  }
  // 图片节点：不支持写入文本，忽略
}

function flashEdge(edge, type) {
  if (!edge.pathEl) return;
  const old = edge.pathEl.getAttribute('stroke');
  edge.pathEl.setAttribute('stroke', type === 'skip' ? '#dc2626' : '#16a34a');
  edge.pathEl.setAttribute('stroke-width', '4');
  setTimeout(() => redrawEdges(), 600);
  void old;
}

// 10. LLM 流式请求
// =========================================================================
// 构造请求体：支持「纯文本」与「文本 + 图片」两种模式
// images: dataURL 数组（如 "data:image/png;base64,..."）
function buildPayload(promptText, doc, images = []) {
  const systemText =
    '你是文本/图像处理引擎。用户会给你【文档】（可能包含文字和图片），' +
    '你必须严格按照【命令】处理它。\n' +
    '若输入包含图片，请直接识别图片内容后按命令处理（不要说你无法看到图片）。\n' +
    '只输出处理结果本身，不要复述命令，不要添加解释、前言或后记。\n\n' +
    '【命令】：' + (promptText || '处理下面的内容');

  // 有图片 → 用多模态 content 数组；否则用普通字符串（保持向后兼容）
  let userContent;
  if (images.length) {
    userContent = [
      { type: 'text', text: '【文档】开始\n' + (doc || '（无文字，只有图片）') + '\n【文档】结束\n\n请执行【命令】，只输出结果。' },
      ...images.map(url => ({ type: 'image_url', image_url: { url } })),
    ];
  } else {
    userContent = '【文档】开始\n' + (doc || '') + '\n【文档】结束\n\n请执行【命令】，只输出结果。';
  }

  return {
    model: 'deepseek-chat',   // 注：当前会路由到 deepseek-flash（支持图片）
    stream: true,
    temperature: 0.3,
    messages: [
      { role: 'system', content: systemText },
      { role: 'user', content: userContent },
    ],
  };
}

async function streamLLM({ key, promptText, doc, images = [], onDelta }) {
  DBG.lastRequest = buildPayload(promptText, doc, images);
  // 图片 dataURL 很长，调试打印时用摘要代替，避免刷屏
  const summary = JSON.parse(JSON.stringify(DBG.lastRequest, (k, v) =>
    (k === 'url' && typeof v === 'string' && v.startsWith('data:'))
      ? `[dataURL ${Math.round(v.length / 1024)}KB]` : v));
  DBG.log('发起请求 ->', API_URL, '\n请求体(摘要) =', summary);

  let full = '';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify(DBG.lastRequest),
    });
    if (!res.ok) {
      const errText = await res.text();
      DBG.err('HTTP 失败', res.status, errText);
      onDelta('❌ HTTP ' + res.status + ' ' + errText);
      return '';
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', chunkCount = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const payload = s.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) chunkCount++;
          full += delta;
          onDelta(full);
        } catch (e) { DBG.warn('SSE 解析失败:', s, e.message); }
      }
    }
    DBG.log('流结束 | 块数 =', chunkCount, '| 长度 =', full.length);
  } catch (err) {
    DBG.err('请求异常:', err);
    onDelta('❌ ' + err.message);
  }
  return full;
}

// ===== run.js ======================================================
// 11. 全局运行 / 快捷键
// =========================================================================
// 重执行节点：聚合所有上游节点的内容，按节点内提示词处理
async function runExecNode(nodeId) {
  const node = state.nodes[nodeId];
  if (!node || node.kind !== 'exec') { DBG.warn('非执行节点', nodeId); return; }

  const promptText = (node.prompt || '').trim();
  if (!promptText) {
    alert('执行节点还没有填写提示词（双击标题可运行）');
    return;
  }

  // 收集所有指向本节点的入边（多输入聚合）
  const incoming = Object.values(state.edges).filter(e => e.target === nodeId);
  DBG.log('========== runExecNode', nodeId, '入边数 =', incoming.length, '==========');
  if (!incoming.length) {
    DBG.warn('没有任何输入连线');
    alert('该执行节点还没有上游连线');
    return;
  }

  const parts = [];
  const images = [];
  incoming.forEach((e, i) => {
    const src = state.nodes[e.source];
    if (!src) return;
    const fromLabel = 'N' + (Object.keys(state.nodes).indexOf(e.source) + 1);
    if (src.kind === 'img' && src.src) {
      images.push(src.src);
      parts.push(`【输入${i + 1} · 来自 ${fromLabel}】[图片]`);
    } else {
      parts.push(`【输入${i + 1} · 来自 ${fromLabel}】\n${src.text || '（空）'}`);
    }
  });
  const merged = parts.join('\n\n');
  DBG.log('聚合输入长度 =', merged.length, '| 图片数 =', images.length);

  const key = document.getElementById('apiKey').value.trim()
    || localStorage.getItem('deepseek_key') || '';
  if (!key) { alert('请先填写 DeepSeek API Key'); return; }

  // 清空结果并显示进行中
  node.text = '';
  node.textEl.textContent = '思考中…';
  node.textEl.classList.remove('empty');

  const out = await streamLLM({
    key, promptText, doc: merged, images,
    onDelta: (t) => { node.text = t; node.textEl.textContent = t; },
  });
  node.text = out;
  DBG.log('========== runExecNode', nodeId, '完成，输出', out.length, '字 ==========');
}

async function runAll() {
  // 按拓扑依赖顺序运行所有连线，保证链式（如 exec A → exec B）顺序正确
  const ordered = topoSortEdges(Object.keys(state.edges));
  const execs = Object.values(state.nodes).filter(n => n.kind === 'exec')
    .sort((a, b) => depthOf(a.id) - depthOf(b.id));
  DBG.log('全部运行：连线', ordered.length, '条，执行节点', execs.length, '个（已按依赖排序）');
  for (const e of ordered) await runEdge(e.id);
  // 最后按拓扑顺序跑执行节点（汇总上游结果）
  for (const n of execs) await runExecNode(n.id);
}

// Alt+Enter：优先运行选中/悬停的连线；否则若选中执行节点则运行它
function runCurrentEdge() {
  let id = state.selectedEdgeId;
  if (!id) {
    const hovered = document.querySelectorAll('#edges .wire:hover');
    if (hovered.length) id = hovered[0].dataset.edge;
  }
  if (id) { runEdge(id); return; }

  // 没有选中连线：看看有没有选中的执行节点
  const sel = Object.values(state.nodes).find(n => n.el.classList.contains('selected'));
  if (sel && sel.kind === 'exec') { runExecNode(sel.id); return; }
  DBG.warn('没有选中/悬停任何连线或执行节点');
}

document.addEventListener('keydown', (e) => {
  if (e.altKey && e.key === 'Enter') {
    e.preventDefault();
    runCurrentEdge();
  }
  // Delete 删除选中连线
  if ((e.key === 'Delete' || e.key === 'Backspace')
      && state.selectedEdgeId
      && document.activeElement === document.body) {
    removeEdge(state.selectedEdgeId);
    redrawEdges();
    window.scheduleSnapshot?.();
  }
});

// 给连线一个可读标签（用于任务面板展示）：N1 → N2（命令）
function edgeLabelText(edge) {
  const nodes = Object.values(state.nodes).sort((a, b) => (a.x - b.x) || (a.y - b.y));
  const idx = (id) => 'N' + (nodes.findIndex(n => n.id === id) + 1);
  const src = state.nodes[edge.source], dst = state.nodes[edge.target];
  if (!src || !dst) return edge.id;
  const cmd = (edge.command || '').trim();
  const cmdTxt = cmd.startsWith(PREFIX) ? cmd.slice(PREFIX.length).trim() : (cmd || '无命令');
  return `${idx(edge.source)} → ${idx(edge.target)} （${cmdTxt}）`;
}

function createTask(name, edgeIds = []) {
  const id = 't' + (++seq.task);
  const task = { id, name: name || ('任务 ' + seq.task), edgeIds: [...edgeIds] };
  state.tasks[id] = task;
  saveTasks();
  refreshTasks();
  DBG.log('创建任务', id, task.name, '含', task.edgeIds.length, '条线');
  return task;
}

function removeTask(id) {
  delete state.tasks[id];
  if (state.activeTaskId === id) state.activeTaskId = null;
  saveTasks();
  refreshTasks();
  redrawEdges();
}

function toggleEdgeInTask(taskId, edgeId) {
  const t = state.tasks[taskId];
  if (!t) return;
  const i = t.edgeIds.indexOf(edgeId);
  if (i >= 0) t.edgeIds.splice(i, 1); else t.edgeIds.push(edgeId);
  saveTasks();
  refreshTasks();
  redrawEdges();
}

// 持久化到 localStorage
function saveTasks() {
  const data = Object.values(state.tasks).map(t => ({ name: t.name, edgeIds: t.edgeIds }));
  try { localStorage.setItem('mc_tasks', JSON.stringify(data)); } catch (e) { DBG.warn('任务保存失败', e); }
}

function loadTasks() {
  try {
    const raw = localStorage.getItem('mc_tasks');
    if (!raw) return;
    const arr = JSON.parse(raw);
    arr.forEach(t => {
      const id = 't' + (++seq.task);
      state.tasks[id] = { id, name: t.name, edgeIds: (t.edgeIds || []).slice() };
    });
    DBG.log('已载入', arr.length, '个任务');
  } catch (e) { DBG.warn('任务载入失败', e); }
}

// 渲染任务面板
function refreshTasks() {
  const body = document.getElementById('taskBody');
  if (!body) return;
  const tasks = Object.values(state.tasks);
  if (!tasks.length) {
    body.innerHTML = '<div class="task-empty">还没有任务。点击上方「＋新建任务」，然后勾选要包含的连线。</div>';
    return;
  }
  const html = [];
  for (const t of tasks) {
    const active = state.activeTaskId === t.id;
    html.push(`<div class="task-card ${active ? 'active' : ''}" data-task="${t.id}">`);
    html.push(`<div class="task-head">`);
    html.push(`<span class="tname">${escapeHtml(t.name)}</span>`);
    html.push(`<span class="tcount">${t.edgeIds.length} 线</span>`);
    html.push(`<span class="trun" data-run="${t.id}" title="运行此任务">▶ 运行</span>`);
    html.push(`</div>`);
    html.push(`<div class="task-lines">`);
    if (!t.edgeIds.length) {
      html.push(`<div class="task-empty">（未选连线）</div>`);
    } else {
      for (const eid of t.edgeIds) {
        const e = state.edges[eid];
        const label = e ? edgeLabelText(e) : '(已删除的线)';
        html.push(`<div class="task-line" data-edge-in="${eid}">`);
        html.push(`<input type="checkbox" checked disabled>`);
        html.push(`<span>${escapeHtml(label)}</span>`);
        html.push(`<span class="grow" style="flex:1"></span>`);
        html.push(`<span data-remove="${t.id}|${eid}" style="color:#dc2626" title="移出任务">×</span>`);
        html.push(`</div>`);
      }
    }
    html.push(`</div>`);
    html.push(`<div class="task-actions">`);
    html.push(`<button data-rename="${t.id}">重命名</button>`);
    html.push(`<button data-select="${t.id}">选中其线</button>`);
    html.push(`<button class="danger" data-del="${t.id}">删除任务</button>`);
    html.push(`</div></div>`);
  }
  body.innerHTML = html.join('');

  // 事件
  body.querySelectorAll('[data-run]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation(); runTask(el.dataset.run);
  }));
  body.querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const [tid, eid] = el.dataset.remove.split('|');
    toggleEdgeInTask(tid, eid);
  }));
  body.querySelectorAll('[data-rename]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const t = state.tasks[el.dataset.rename];
    const n = prompt('任务名称：', t.name);
    if (n !== null) { t.name = n; saveTasks(); refreshTasks(); refreshOutline(); }
  }));
  body.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation(); removeTask(el.dataset.del);
  }));
  body.querySelectorAll('[data-select]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    state.activeTaskId = el.dataset.select;
    refreshTasks(); redrawEdges();
  }));
  body.querySelectorAll('.task-card').forEach(el => el.addEventListener('click', () => {
    state.activeTaskId = el.dataset.task;
    refreshTasks(); redrawEdges();
  }));
}

// 将任务内的边按拓扑依赖顺序排序（上游先执行）
// 只要任务边集里存在 A→B 且 B 的结果被后续使用，就保证顺序
function topoSortEdges(edgeIds) {
  const set = new Set(edgeIds.filter(id => state.edges[id]));
  // 构造“节点依赖”：边的 target 节点必须在其 source 节点之后处理
  // 简化做法：按目标节点的拓扑层级排序（用重复松弛）
  const edges = [...set].map(id => state.edges[id]);
  // 计算每个节点的深度（无环图）：depth(node) = max(depth(pred)) + 1
  const depth = {};
  Object.keys(state.nodes).forEach(n => depth[n] = 0);
  for (let iter = 0; iter < Object.keys(state.nodes).length + 2; iter++) {
    let changed = false;
    for (const e of edges) {
      if (depth[e.target] < depth[e.source] + 1) {
        depth[e.target] = depth[e.source] + 1;
        changed = true;
      }
    }
    if (!changed) break;
  }
  return edges.sort((a, b) => depth[a.target] - depth[b.target]);
}

// 运行一个任务：按拓扑顺序跑任务内的所有连线，再跑相关的执行节点
async function runTask(taskId) {
  const t = state.tasks[taskId];
  if (!t) return;
  state.activeTaskId = taskId;
  refreshTasks();
  const ordered = topoSortEdges(t.edgeIds);
  DBG.log('========== 运行任务', t.name, '共', ordered.length, '条线 ==========');

  for (const e of ordered) await runEdge(e.id);

  // 任务内所有被指的 exec 节点，按拓扑顺序跑
  const execIds = new Set();
  for (const e of ordered) {
    const dst = state.nodes[e.target];
    if (dst && dst.kind === 'exec') execIds.add(dst.id);
  }
  const execs = [...execIds].map(id => state.nodes[id])
    .sort((a, b) => (depthOf(a.id) - depthOf(b.id)));
  for (const n of execs) await runExecNode(n.id);
  DBG.log('========== 任务', t.name, '完成 ==========');
}

function depthOf(nodeId) {
  // 简单计算：从起点到该节点的最长路径（用于 exec 排序）
  const edges = Object.values(state.edges);
  const depth = {};
  Object.keys(state.nodes).forEach(n => depth[n] = 0);
  for (let i = 0; i < Object.keys(state.nodes).length + 2; i++) {
    let ch = false;
    for (const e of edges) if (depth[e.target] < depth[e.source] + 1) { depth[e.target] = depth[e.source] + 1; ch = true; }
    if (!ch) break;
  }
  return depth[nodeId] || 0;
}

// 左侧 Tab 切换
function switchOlTab(tab) {
  state.olTab = tab;
  document.querySelectorAll('.ol-tab').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab));
  document.getElementById('paneOutline').style.display = tab === 'outline' ? 'flex' : 'none';
  document.getElementById('paneTasks').style.display = tab === 'tasks' ? 'flex' : 'none';

// ===== chat.js =====================================================
// 11.8 画布序列化 —— 让对话能“识别整张图”
// =========================================================================
// 把当前画布（节点 + 连线）变成一段结构化文本，喂给模型。
// 包含：每个节点的类型/标题/内容（图片用占位符）、每条连线的源→目标及命令。
function serializeCanvas(opts = {}) {
  const { maxCharsPerNode = 600 } = opts;
  const nodes = Object.values(state.nodes);
  const edges = Object.values(state.edges);

  // 给节点一个可读的稳定编号：按位置从左到右、从上到下排序
  const sorted = [...nodes].sort((a, b) => (a.x - b.x) || (a.y - b.y));
  const labelOf = new Map();
  sorted.forEach((n, i) => labelOf.set(n.id, 'N' + (i + 1)));

  const lines = [];
  lines.push('【画布结构】');

  // 区域（= 大纲层级单位）
  const zones = Object.values(state.zones);
  if (zones.length) {
    lines.push('区域（大纲层级，' + zones.length + ' 个）：');
    for (const z of zones) {
      const cnt = Object.values(state.nodes).filter(n => n.zoneId === z.id).length;
      lines.push(`- ${z.title}（${cnt} 个节点）`);
    }
  }

  lines.push('节点（' + nodes.length + ' 个）：');
  for (const n of sorted) {
    const tag = labelOf.get(n.id);
    const kind = { doc: '文档', output: '输出', img: '图片', exec: '执行' }[n.kind] || n.kind;
    const zoneName = n.zoneId && state.zones[n.zoneId] ? state.zones[n.zoneId].title : '未分类';
    let content;
    if (n.kind === 'img') {
      content = n.src ? '[图片]' : '[空图片]';
    } else if (n.kind === 'exec') {
      const p = (n.prompt || '').trim();
      const r = (n.text || '').trim();
      content = '提示词=' + (p ? JSON.stringify(p) : '(空)') +
                ' 结果=' + (r ? '"' + (r.length > maxCharsPerNode ? r.slice(0, maxCharsPerNode) + '…' : r) + '"' : '(空)');
    } else {
      const t = (n.text || '').trim();
      content = t ? '"' + (t.length > maxCharsPerNode ? t.slice(0, maxCharsPerNode) + '…(已截断)' : t) + '"' : '(空)';
    }
    lines.push(`- ${tag} [${kind}] 区域=${JSON.stringify(zoneName)} 标题=${JSON.stringify(n.title)} ${content}`);
  }

  lines.push('连线（' + edges.length + ' 条）：');
  if (!edges.length) lines.push('- （无）');
  for (const e of edges) {
    const from = labelOf.get(e.source) || e.source;
    const to   = labelOf.get(e.target) || e.target;
    const cmd  = (e.command || '').trim();
    const exec = cmd.startsWith(PREFIX) ? cmd.slice(PREFIX.length).trim() : '';
    lines.push(`- ${from} → ${to} 命令=${exec ? JSON.stringify(exec) : '(无，不执行)'}`);
  }
  return lines.join('\n');
}

const chat = { messages: [], busy: false };

function addMsg(role, text, meta) {
  const box = document.getElementById('msgs');
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (meta) {
    const m = document.createElement('span');
    m.className = 'meta'; m.textContent = meta;
    el.appendChild(m);
  }
  el.appendChild(document.createTextNode(text));
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

// 发送消息：自动把画布快照(+可选图片)拼入上下文
async function sendChat() {
  if (chat.busy) return;
  const input = document.getElementById('chatInput');
  const userText = input.value.trim();
  if (!userText) return;
  const key = document.getElementById('apiKey').value.trim()
    || localStorage.getItem('deepseek_key') || '';
  if (!key) { alert('请先填写 DeepSeek API Key'); return; }

  const withImages = document.getElementById('includeImages').checked;
  const snapshot = serializeCanvas();
  const images = withImages ? collectCanvasImages() : [];

  // 记录并显示用户消息
  chat.messages.push({ role: 'user', text: userText });
  addMsg('user', userText, '我');
  input.value = '';

  // 构建请求：system 给角色与画布上下文；之后是历史消息
  const systemText =
    '你是一个能看画布的助手。下面是用户当前的画布（节点与连线）：\n\n' +
    snapshot + '\n\n' +
    '规则：\n' +
    '1. 回答时必须基于上述画布内容；提到节点时用 N1/N2 这样的编号。\n' +
    '2. 若消息中附带了图片，请直接识别图片内容（不要说你无法看到图片）。\n' +
    '3. 回答简洁、准确，用中文。';

  // 历史消息（只带文本），最新一条附上图片
  const history = chat.messages.map(m => ({
    role: m.role, content: m.text,
  }));
  if (images.length) {
    // 把最后一条 user 消息改成多模态
    const last = history[history.length - 1];
    last.content = [
      { type: 'text', text: last.content + '\n\n（下面是画布上的图片，请结合它们回答）' },
      ...images.map(im => ({ type: 'image_url', image_url: { url: im.src } })),
    ];
  }

  const payload = {
    model: 'deepseek-chat',
    stream: true,
    temperature: 0.3,
    messages: [{ role: 'system', content: systemText }, ...history],
  };

  DBG.lastRequest = payload;
  DBG.log('对话请求', { 节点数: Object.keys(state.nodes).length, 图片数: images.length });

  chat.busy = true;
  const btn = document.getElementById('sendMsg');
  btn.disabled = true;
  const bubble = addMsg('assistant', '', '助手');
  bubble.textContent = '…';

  let full = '';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()));
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const s0 of lines) {
        const s = s0.trim();
        if (!s.startsWith('data:')) continue;
        const p = s.slice(5).trim();
        if (p === '[DONE]') continue;
        try {
          const j = JSON.parse(p);
          const d = j.choices?.[0]?.delta?.content || '';
          if (d) { full += d; bubble.textContent = full; }
        } catch {}
      }
    }
    chat.messages.push({ role: 'assistant', text: full });
    DBG.log('对话完成，', full.length, '字');
  } catch (err) {
    DBG.err('对话失败:', err);
    bubble.className = 'msg error';
    bubble.textContent = '❌ ' + err.message;
  } finally {
    chat.busy = false;
    btn.disabled = false;
    document.getElementById('msgs').scrollTop = 1e9;
  }
}

function bindSidebar() {
  document.getElementById('sendMsg').addEventListener('click', sendChat);

}
